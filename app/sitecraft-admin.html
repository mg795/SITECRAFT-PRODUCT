<title>Sitecraft Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════ V1 design system, the same one the editor uses ═══════ */
:root{
  --navy:#16243C; --bar:#131A28; --bar-2:#26314A;
  --red:#C41E3A;
  --green:#7EB93F; --green-d:#6BA032; --green-x:#5A8829; --green-pale:#EAF4DC; --green-ink:#4C7A1F;
  --amber:#E2932B; --amber-bg:#FDF4E3; --amber-ink:#8A6416;
  --blue:#2563EB; --blue-pale:#EDF2FE;
  --page:#F4F5F7; --card:#FFFFFF; --sunk:#EFF1F4; --rule:#E4E7EC; --rule-2:#EEF0F3;
  --ink:#16243C; --ink-2:#495A72; --mut:#77869B; --faint:#9AA7B8;
  --sh:0 14px 44px rgba(16,24,40,.16);
  --f:"Inter",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#E7ECF3; --bar:#0A0E16; --bar-2:#1E2739; --red:#F2647C;
  --green:#8CC64C; --green-d:#7EB93F; --green-x:#6FA636; --green-pale:#1E2A16; --green-ink:#A8D472;
  --amber:#E2932B; --amber-bg:#2A2113; --amber-ink:#E0B476; --blue:#7FA6F5; --blue-pale:#18202E;
  --page:#0B1016; --card:#161C25; --sunk:#1E252F; --rule:#2A3240; --rule-2:#222932;
  --ink:#E7ECF3; --ink-2:#B2BECD; --mut:#8494A6; --faint:#66748A; --sh:0 14px 44px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --navy:#E7ECF3; --bar:#0A0E16; --bar-2:#1E2739; --red:#F2647C;
  --green:#8CC64C; --green-d:#7EB93F; --green-x:#6FA636; --green-pale:#1E2A16; --green-ink:#A8D472;
  --amber:#E2932B; --amber-bg:#2A2113; --amber-ink:#E0B476; --blue:#7FA6F5; --blue-pale:#18202E;
  --page:#0B1016; --card:#161C25; --sunk:#1E252F; --rule:#2A3240; --rule-2:#222932;
  --ink:#E7ECF3; --ink-2:#B2BECD; --mut:#8494A6; --faint:#66748A; --sh:0 14px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{display:flex;align-items:center;gap:.8rem;padding:.55rem 1.5rem;background:var(--bar);color:#C7D0DE;font-size:.8rem;font-weight:600}
.top b{color:#fff;font-weight:700}
.top .sp{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.top .who{color:#8FA0B5;font-weight:500}
.crumb{display:flex;align-items:center;gap:.5rem;padding:1.1rem 1.5rem .2rem;font-size:.8rem;color:var(--mut)}
.crumb button{border:0;background:transparent;color:var(--green-d);font-weight:700;padding:0;font-size:.8rem}
.crumb button:hover{color:var(--green-x)}
main{max-width:76rem;margin:0 auto;padding:.6rem 1.5rem 5rem}
h1{font-size:1.55rem;letter-spacing:-.022em;font-weight:800;margin:.2rem 0 .2rem;color:var(--navy)}
h2{font-size:1.02rem;font-weight:700;letter-spacing:-.014em;margin:0;color:var(--navy)}
.sub{color:var(--mut);font-size:.86rem;margin:0 0 1.1rem}
.hd{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.hd .sp{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

.card{background:var(--card);border-radius:12px;padding:1.05rem 1.15rem;margin-bottom:1rem}
.card>.ttl{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem}
.card>.ttl .sp{margin-left:auto;display:flex;gap:.45rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* buttons */
.g{border:0;background:var(--green);color:#fff;padding:.55rem 1.05rem;border-radius:999px;font-size:.86rem;font-weight:700;transition:background .14s;white-space:nowrap}
.g:hover{background:var(--green-d)} .g:active{background:var(--green-x)}
.g[disabled]{background:var(--sunk);color:var(--faint);cursor:not-allowed}
.s{border:0;background:var(--sunk);color:var(--ink-2);padding:.55rem 1.05rem;border-radius:999px;font-size:.86rem;font-weight:600;transition:background .14s,color .14s;white-space:nowrap}
.s:hover{background:var(--green);color:#fff}
.s[disabled]{color:var(--faint);cursor:not-allowed}
.s[disabled]:hover{background:var(--sunk);color:var(--faint)}
.t{border:0;background:transparent;color:var(--green-d);font-size:.82rem;font-weight:700;padding:.2rem 0}
.t:hover{color:var(--green-x)}
.t.warn{color:var(--red)}
.mini{border:0;background:var(--sunk);color:var(--ink-2);padding:.22rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.mini:hover{background:var(--rule)}
.mini.on{background:var(--green-pale);color:var(--green-ink)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;padding:.16rem .5rem;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.gr{background:var(--green-pale);color:var(--green-ink)}
.chip.am{background:var(--amber-bg);color:var(--amber-ink)}
.chip.rd{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.chip.bl{background:var(--blue-pale);color:var(--blue)}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}

/* table */
.tw{overflow-x:auto;background:var(--card);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:60rem}
th{text-align:left;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:.75rem .8rem;border-bottom:1px solid var(--rule)}
td{padding:.7rem .8rem;border-bottom:1px solid var(--rule-2);font-size:.85rem;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td .nm{font-weight:700;color:var(--navy);display:block}
td .sm{color:var(--mut);font-size:.76rem;display:block}
td .acts{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.num{font-variant-numeric:tabular-nums}

/* rows */
.row{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;padding:.6rem 0;border-bottom:1px solid var(--rule-2);align-items:start}
.row:last-child{border-bottom:0}
.row .k{font-size:.74rem;font-weight:700;color:var(--mut);min-width:8.5rem}
.row .v{min-width:0;font-size:.86rem}
.row .v .sm{display:block;color:var(--mut);font-size:.76rem}
.row .a{display:flex;gap:.35rem;align-items:center}

/* forms */
label{display:block;font-size:.74rem;font-weight:700;color:var(--mut);margin:.7rem 0 .2rem}
.fld{width:100%;padding:.55rem .7rem;border:0;border-radius:9px;background:var(--sunk);color:var(--ink);font-size:.9rem;outline:none}
.fld.bad{box-shadow:inset 0 0 0 1.5px var(--red)}
textarea.fld{min-height:5rem;resize:vertical}
.help{font-size:.75rem;color:var(--mut);margin-top:.2rem}
.err{font-size:.75rem;color:var(--red);font-weight:600;margin-top:.2rem}

/* notices */
.note{border-radius:8px;padding:.6rem .8rem;font-size:.82rem;line-height:1.5;margin:.5rem 0}
.note.am{background:var(--amber-bg);color:var(--amber-ink)}
.note.gr{background:var(--green-pale);color:var(--green-ink)}
.note.rd{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red)}
.note b{font-weight:700}

/* exception report */
.exc{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;padding:.7rem 0;border-bottom:1px solid var(--rule-2);align-items:start}
.exc:last-child{border-bottom:0}
.exc.done{opacity:.5}
.exc .lb{font-size:.72rem;font-weight:700;white-space:nowrap;padding-top:.1rem}
.exc.critical .lb{color:var(--red)}
.exc.warning .lb{color:var(--amber-ink)}
.exc.note .lb{color:var(--mut)}
.exc .msg{font-size:.86rem;color:var(--ink)}
.exc .meta{font-size:.75rem;color:var(--mut)}
.exc .fix{font-size:.75rem;color:var(--green-ink)}
.check{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;font-size:.84rem;border-bottom:1px solid var(--rule-2)}
.check:last-child{border-bottom:0}
.check .m{width:1.15rem;height:1.15rem;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:800;flex:none;color:#fff}
.check.pass .m{background:var(--green-d)} .check.fail .m{background:var(--red)}
.check .d{margin-left:auto;color:var(--mut);font-size:.76rem}

/* component permission editor */
.comp{border:1px solid var(--rule);border-radius:10px;padding:.7rem .8rem;margin-bottom:.55rem}
.comp .ch{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.comp .ch .ty{font-size:.72rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--blue)}
.comp .ch .tx{font-size:.85rem;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.comp .fl{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}
.locked{font-size:.72rem;color:var(--faint);margin-top:.35rem}

.pg{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--rule-2)}
.pg:last-child{border-bottom:0}
.pg .n{font-weight:700;font-size:.87rem;color:var(--navy)}
.pg .u{font-size:.75rem;color:var(--mut);font-family:ui-monospace,monospace}
.pg .sp{margin-left:auto;display:flex;gap:.4rem;align-items:center}

.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{border:0;background:transparent;color:var(--ink-2);font-size:.85rem;font-weight:600;padding:.4rem .8rem;border-radius:999px}
.tabs button:hover{background:var(--sunk)}
.tabs button.on{background:var(--navy);color:var(--card)}

.log{font-size:.8rem;display:grid;gap:.1rem}
.log div{display:grid;grid-template-columns:9.5rem auto 1fr;gap:.5rem;padding:.3rem 0;border-bottom:1px solid var(--rule-2)}
.log .w{color:var(--mut);font-variant-numeric:tabular-nums}
.log .who{color:var(--green-ink);font-weight:600}
.empty{padding:2rem 1rem;text-align:center;color:var(--faint);font-size:.86rem}

.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--bar);color:#fff;padding:.6rem 1rem;border-radius:9px;font-size:.84rem;box-shadow:var(--sh);z-index:200;max-width:calc(100vw - 2rem);text-align:center}
.scrim{position:fixed;inset:0;background:rgba(12,18,28,.42);z-index:150;display:none}
.scrim.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(34rem,calc(100vw - 2rem));max-height:calc(100vh - 4rem);overflow-y:auto;background:var(--card);border-radius:14px;box-shadow:var(--sh);z-index:160;padding:1.2rem 1.3rem 1.3rem;display:none}
.modal.on{display:block}
.modal h2{margin-bottom:.2rem}
.modal .ft{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.1rem}
</style>

<div class="top">
  <b>Sitecraft</b><span>Admin</span>
  <span class="sp"><span class="who" id="who">Read Tomato</span></span>
</div>
<div class="crumb" id="crumb"></div>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/*
 * Sitecraft Admin — the Read Tomato side of Sitecraft Junior.
 *
 * This is Process A: migration, review, permission and provisioning. It is a
 * different product from the editor a client uses and is deliberately not built on
 * the same screens. An administrator needs the whole truth about a site; a client
 * needs the four things they came to do.
 *
 * Nothing on this screen can touch a client's live website. Migration writes a
 * staging model, review approves it, and putting a site on a public domain is a
 * separate act that lives nowhere in this file.
 */

/* ═══════════ where the truth lives ═══════════ */
/*
 * There is no server yet, so an account lives in this browser. That is the honest
 * position and it is written down here rather than implied: everything below is the
 * real shape of the data, and the only thing standing in for a database is a
 * localStorage key. Publishing, invitation email and tenancy isolation are the
 * three things that cannot be finished without one.
 */
const KEY = 'sitecraft.admin.v1';
const ME  = 'mg@readtomato.com';

const CATEGORIES = ['Dentist','Realtor','Charity','Law','Accountancy','Trades','Clinic',
                    'Restaurant','Veterinary','Salon','Other'];
const DEFAULT_ALLOWANCE = 3;

const STATUS = {
  not_started:   { label:'Not Started',           cls:'' },
  crawling:      { label:'Crawling',              cls:'bl' },
  processing:    { label:'Processing',            cls:'bl' },
  reconstructed: { label:'Site Reconstructed',    cls:'bl' },
  issues:        { label:'Issues Found',          cls:'am' },
  review:        { label:'Admin Review Required', cls:'am' },
  approved:      { label:'Approved',              cls:'gr' },
  client_ready:  { label:'Ready for Client',      cls:'gr' },
  live:          { label:'Live',                  cls:'gr' },
  failed:        { label:'Migration Failed',      cls:'rd' },
};
const INVITE = {
  not_invited: { label:'Not Invited', cls:'' },
  sent:        { label:'Invitation Sent', cls:'bl' },
  activated:   { label:'Activated', cls:'gr' },
  suspended:   { label:'Suspended', cls:'am' },
  cancelled:   { label:'Cancelled', cls:'rd' },
};

let DB = load();
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { accounts: [] };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch { toast('This browser will not keep the account list. Nothing is lost while the tab is open.'); }
}

/* ═══════════ small helpers ═══════════ */
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'a' + Math.random().toString(36).slice(2, 9);
const now = () => new Date().toISOString();
const when = t => { if (!t) return 'never'; const d = new Date(t);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); };
const acct = id => DB.accounts.find(a => a.id === id);
const chip = (t, cls) => `<span class="chip ${cls || ''}">${esc(t)}</span>`;

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 4200);
}
/* Every action a person takes on an account is written down (§40). */
function logIt(a, what, who){
  a.log = a.log || [];
  a.log.unshift({ at: now(), who: who || ME, what });
  a.log = a.log.slice(0, 300);
}

/* An address, tidied, or nothing. */
function normUrl(v){
  const t = String(v || '').trim();
  if (!t) return '';
  try {
    const u = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t);
    return u.hostname.includes('.') ? u.href : '';
  } catch { return ''; }
}
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const stagingFor = a => 'https://' + (a.slug || 'client') + '.staging.sitecraft.readtomato.com';

/* ═══════════ what a client may edit ═══════════ */
/*
 * The whitelist, mirrored from packages/site-import/src/library.js. An administrator
 * can only ever narrow it: a field the library does not declare editable has no
 * control here at all, which is why locking a font is not a setting — it is simply
 * not a field.
 */
const LIBRARY = {
  hero:          { label:'Hero',                 dup:false, fields:{eyebrow:'Eyebrow',headline:'Headline',body:'Body Copy',image:'Image',ctaLabel:'Button Label',ctaHref:'Button Link'} },
  text:          { label:'Text',                 dup:true,  fields:{headline:'Headline',body:'Body Copy',list:'List'} },
  image:         { label:'Image',                dup:true,  fields:{image:'Image',caption:'Caption'} },
  image_text:    { label:'Image and Text',       dup:true,  fields:{headline:'Headline',body:'Body Copy',image:'Image',list:'List',ctaLabel:'Button Label',ctaHref:'Button Link'} },
  cta:           { label:'Call to Action',       dup:true,  fields:{headline:'Headline',body:'Body Copy',ctaLabel:'Button Label',ctaHref:'Button Link'} },
  featured_item: { label:'Featured Items',       dup:true,  fields:{headline:'Headline',items:'Items'} },
  blog_listing:  { label:'Blog Listing',         dup:false, fields:{headline:'Headline',body:'Body Copy'} },
  blog_post:     { label:'Blog Post',            dup:false, fields:{title:'Title',image:'Featured Image',body:'Article',author:'Author',date:'Publish Date'} },
  embed:         { label:'Third-Party Feature',  dup:false, fields:{headline:'Heading',body:'Body Copy'} },
};
const LOCKED = 'Fonts, colours, widths, spacing and layout are not fields. A client has no way to change them.';

const compText = c => {
  const f = c.fields || {};
  return f.headline || f.title || f.vendor || (f.image && f.image.alt) || f.body || '';
};
const isEditable = (a, c, k) => !(a.perms && a.perms[c.id] && a.perms[c.id][k] === false);
const isDup = (a, c) => LIBRARY[c.type] && LIBRARY[c.type].dup && !(a.dup && a.dup[c.id] === false);

/* ═══════════ migration gates ═══════════ */
const criticals = a => !a.migration ? [] :
  a.migration.report.entries.filter(e => e.severity === 'critical' && !resolved(a, e));
const resolved = (a, e) => !!(a.resolved && a.resolved[excKey(e)]);
const excKey = e => e.kind + '|' + e.page + '|' + (e.detail || '');
const pagesOf = a => a.migration ? Object.values(a.migration.site) : [];
const unapproved = a => pagesOf(a).filter(p => !(a.pagesApproved || {})[p.key]);

function canApprove(a){
  if (!a.migration) return { ok:false, why:'There is nothing to approve until a migration has run.' };
  const c = criticals(a).length;
  if (c) return { ok:false, why: c + ' critical exception' + (c === 1 ? '' : 's') + ' still to resolve.' };
  const u = unapproved(a).length;
  if (u) return { ok:false, why: u + ' page' + (u === 1 ? '' : 's') + ' not reviewed yet.' };
  return { ok:true };
}
function canInvite(a){
  if (!a.approved) return { ok:false, why:'A client can only be invited to a site an administrator has approved.' };
  if (a.account === 'suspended') return { ok:false, why:'This account is suspended.' };
  return { ok:true };
}
const revsLeft = a => a.unlimited ? Infinity : Math.max(0, (a.allowance || 0) + (a.extra || 0) - (a.used || 0));
const revsText = a => a.unlimited ? 'No limit' : revsLeft(a) + ' of ' + ((a.allowance || 0) + (a.extra || 0));

/* ═══════════ routing ═══════════ */
let VIEW = { name:'accounts', id:null, tab:'overview' };
function go(name, id, tab){
  VIEW = { name, id: id || null, tab: tab || 'overview' };
  render();
  window.scrollTo({ top:0 });
}
function render(){
  const c = $('#crumb');
  if (VIEW.name === 'accounts'){ c.innerHTML = 'All Sitecraft accounts'; accountsView(); }
  else if (VIEW.name === 'create'){
    c.innerHTML = '<button data-go="accounts">Accounts</button> › New client';
    createView();
  } else {
    const a = acct(VIEW.id);
    if (!a) return go('accounts');
    c.innerHTML = '<button data-go="accounts">Accounts</button> › ' + esc(a.business);
    accountView(a);
  }
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}

/* ═══════════ the accounts screen (§4) ═══════════ */
/* Deliberately thin. Everything technical about a migration lives inside the
   account, because this screen is read to decide which account to open. */
function accountsView(){
  const rows = DB.accounts.map(a => {
    const st = STATUS[a.status] || STATUS.not_started;
    const inv = INVITE[a.invite || 'not_invited'];
    return `<tr>
      <td><span class="nm">${esc(a.business)}</span>
          <span class="sm">${esc(a.category || '')}${a.assignee ? ' · ' + esc(a.assignee) : ''}</span></td>
      <td><span class="nm" style="font-weight:600">${esc(a.contactFirst + ' ' + a.contactLast)}</span>
          <span class="sm">${esc(a.email)}</span></td>
      <td><span class="sm">${esc(host(a.url))}</span>
          <span class="sm">${a.migration ? esc(host(a.staging)) : '<i>no staging site yet</i>'}</span></td>
      <td>${chip(st.label, st.cls)}${a.account === 'suspended' ? ' ' + chip('Suspended','rd') : ''}</td>
      <td>${chip(inv.label, inv.cls)}</td>
      <td class="num">${esc(revsText(a))}<span class="sm">last publish ${esc(when(a.lastPublish))}</span></td>
      <td class="num"><span class="sm">${esc(when(a.lastLogin))}</span></td>
      <td><div class="acts">
        <button class="mini" data-open="${a.id}">Open</button>
        ${!a.migration ? `<button class="mini" data-mig="${a.id}">Start Migration</button>`
                       : `<button class="mini" data-rev="${a.id}">Review</button>`}
      </div></td></tr>`;
  }).join('');

  $('#app').innerHTML = `
    <div class="hd">
      <div><h1>Accounts</h1>
        <p class="sub">${DB.accounts.length} Sitecraft account${DB.accounts.length === 1 ? '' : 's'}.
        ${DB.accounts.filter(a => criticals(a).length).length} need attention.</p></div>
      <div class="sp">
        ${DB.accounts.length ? '' : '<button class="s" id="seed">Add the Example Account</button>'}
        <button class="g" id="new">Create Client</button></div>
    </div>
    ${DB.accounts.length ? `<div class="tw"><table>
      <thead><tr><th>Business</th><th>Primary Contact</th><th>Websites</th><th>Migration</th>

      <tbody>${rows}</tbody></table></div>`
      : `<div class="card"><div class="empty">No accounts yet.
           Create a client to begin, or add the example account to see the whole workflow.</div></div>`}`;

  $('#new').onclick = () => go('create');

}

/* ═══════════ create a client (§5) ═══════════ */
/* The account exists before migration begins, so authorisation and the source URL
   have somewhere to be recorded. */
function createView(){
  const f = createView.draft = createView.draft || { allowance: DEFAULT_ALLOWANCE };
  const field = (k, label, opts = {}) => `<label for="f-${k}">${label}${opts.opt ? ' <span style="font-weight:500;text-transform:none">(optional)</span>' : ''}</label>
    ${opts.select
      ? `<select class="fld" id="f-${k}">${opts.select.map(o =>
          `<option${f[k] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : opts.area
        ? `<textarea class="fld" id="f-${k}" placeholder="${esc(opts.ph || '')}">${esc(f[k] || '')}</textarea>`
        : `<input class="fld" id="f-${k}" type="${opts.type || 'text'}" value="${esc(f[k] || '')}" placeholder="${esc(opts.ph || '')}" autocomplete="off">`}
    ${opts.help ? `<div class="help">${opts.help}</div>` : ''}
    <div class="err" id="e-${k}" hidden></div>`;

  $('#app').innerHTML = `
    <div class="hd"><div><h1>Create Client</h1>
      <p class="sub">The account is created first. Migration comes after, once authorisation is recorded.</p></div></div>
    <div class="grid2">
      <div class="card">
        <div class="ttl"><h2>The business</h2></div>
        ${field('business','Business name', {ph:'Northgate Dental Care'})}
        ${field('url','Source website address', {ph:'northgate-dental.com', help:'The site Sitecraft will migrate.'})}
        ${field('category','Business category', {select: CATEGORIES})}
        ${field('billing','Billing reference', {opt:true})}
      </div>
      <div class="card">
        <div class="ttl"><h2>The primary contact</h2></div>
        ${field('contactFirst','First name')}
        ${field('contactLast','Last name')}
        ${field('email','Email address', {type:'email', ph:'name@business.com'})}
        ${field('phone','Telephone', {opt:true})}
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="ttl"><h2>How they will work</h2></div>
        ${field('allowance','Revisions each billing period',
          {type:'number', help:'A revision is one publication, however many changes it carries. Three is the default.'})}
        ${field('assignee','Assigned Read Tomato employee', {opt:true, ph:'mg@readtomato.com'})}
      </div>
      <div class="card">
        <div class="ttl"><h2>Internal notes</h2></div>
        ${field('notes','Notes', {opt:true, area:true, ph:'Anything the next person needs to know. Clients never see this.'})}
      </div>
    </div>
    <div class="hd"><div class="sp">
      <button class="s" data-go="accounts">Cancel</button>
      <button class="g" id="mk">Create Account</button></div></div>`;

  const read = () => {
    ['business','url','category','billing','contactFirst','contactLast','email','phone','allowance','assignee','notes']
      .forEach(k => { const el = $('#f-' + k); if (el) f[k] = el.value; });
  };
  document.querySelectorAll('.fld').forEach(el => el.oninput = read);
  $('#mk').onclick = () => {
    read();
    const bad = {};
    if (!String(f.business || '').trim()) bad.business = 'A business name is needed.';
    if (!normUrl(f.url)) bad.url = "That doesn't look like a website address.";
    if (!String(f.contactFirst || '').trim()) bad.contactFirst = 'A first name is needed.';
    if (!String(f.contactLast || '').trim()) bad.contactLast = 'A last name is needed.';
    if (!/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(String(f.email || '').trim())) bad.email = "That doesn't look like an email address.";
    const allowance = parseInt(f.allowance, 10);
    if (!(allowance >= 0 && allowance <= 99)) bad.allowance = 'A number between 0 and 99.';
    document.querySelectorAll('.err').forEach(e => e.hidden = true);
    document.querySelectorAll('.fld').forEach(e => e.classList.remove('bad'));
    if (Object.keys(bad).length){
      for (const k in bad){
        const e = $('#e-' + k); if (e){ e.textContent = bad[k]; e.hidden = false; }
        const i = $('#f-' + k); if (i) i.classList.add('bad');
      }
      return toast('Some details still need filling in.');
    }
    const slug = String(f.business).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
    const a = {
      id: uid(), slug,
      business: f.business.trim(), url: normUrl(f.url), category: f.category || CATEGORIES[0],
      contactFirst: f.contactFirst.trim(), contactLast: f.contactLast.trim(),
      email: f.email.trim(), phone: (f.phone || '').trim(),
      billing: (f.billing || '').trim(), assignee: (f.assignee || '').trim(), notes: f.notes || '',
      allowance, extra: 0, used: 0, unlimited: false,
      status: 'not_started', invite: 'not_invited', account: 'active',
      authorisation: null, migration: null, reviewed: false, approved: false,
      perms: {}, dup: {}, pagesApproved: {}, resolved: {},
      lastLogin: null, lastPublish: null, versions: [], log: [],
      createdAt: now(),
    };
    a.staging = stagingFor(a);
    logIt(a, 'Account created');
    DB.accounts.unshift(a);
    createView.draft = null;
    save();
    toast(a.business + ' created. Confirm authorisation to begin the migration.');
    go('account', a.id, 'migration');
  };
}

/* ═══════════ migration (§6, §7, §8, §12, §14) ═══════════ */
function tabMigration(a){
  const auth = a.authorisation;
  $('#tab').innerHTML = `
    <div class="card"><div class="ttl"><h2>Authorisation</h2>
      ${auth ? `<span class="sp">${chip('Confirmed','gr')}</span>` : ''}</div>
      ${auth
        ? `${rowOf('Confirmed by', esc(auth.by))}
           ${rowOf('When', esc(when(auth.at)))}
           ${rowOf('For', `<span class="sm">${esc(auth.url)}</span>`)}
           <div class="help">Recorded against this account. Migrating a different address needs a new confirmation.</div>`
        : `<p style="margin:.2rem 0 .6rem;font-size:.88rem">Sitecraft is not a website copying tool.
             A migration cannot begin until a Read Tomato administrator confirms the client has
             authorised it.</p>
           <label style="display:flex;gap:.6rem;align-items:flex-start;text-transform:none;font-size:.88rem;color:var(--ink);font-weight:500">
             <input type="checkbox" id="auth" style="margin-top:.35rem">
             <span>I confirm that Read Tomato has authorisation to reproduce
               <b>${esc(host(a.url))}</b> for ${esc(a.business)}.</span></label>
           <div class="hd" style="margin:.8rem 0 0"><div class="sp">
             <button class="g" id="doAuth" disabled>Record Authorisation</button></div></div>`}
    </div>

    <div class="card"><div class="ttl"><h2>Migration</h2>
      <span class="sp">${chip(STATUS[a.status].label, STATUS[a.status].cls)}</span></div>
      <div class="note gr"><b>Everything a migration produces goes to staging.</b>
        Sitecraft never writes to the client's own website, and putting a site on a public
        domain is a separate, deliberate action that migration cannot take.</div>
      ${!auth ? '<div class="note am">Confirm authorisation above before starting.</div>' : `
        <p style="font-size:.88rem;margin:.6rem 0">Sitecraft opens every page of
          <b>${esc(host(a.url))}</b>, renders it, reads what is on it, and rebuilds it as Sitecraft
          pages and components. Third-party features are identified rather than copied.</p>
        <label for="mj">The site model</label>
        <textarea class="fld" id="mj" rows="4" placeholder="Paste what the importer wrote"></textarea>
        <div class="help">The crawler runs on a server: a browser page may not read another origin,
          and these sites have to be rendered before there is anything to read. Where the import
          server is not reachable, run it from a command line and paste the result:<br>
          <code>node packages/site-import/bin/import.js ${esc(host(a.url))} --out client.json</code></div>
        <div class="hd" style="margin:.9rem 0 0"><div class="sp">
          ${a.migration ? '<button class="s" id="clear">Discard This Migration</button>' : ''}
          <button class="s" id="fetch">Fetch From the Import Server</button>
          <button class="g" id="load">Load the Model</button></div></div>`}
    </div>

    ${a.migration ? `<div class="card"><div class="ttl"><h2>This migration</h2></div>
      ${rowOf('Ran', esc(when(a.migration.at)))}
      ${rowOf('Pages', String(a.migration.summary.pages))}
      ${rowOf('Exceptions', a.migration.report.counts.total + ' · ' +
        a.migration.report.counts.critical + ' critical')}
      ${rowOf('Staging site', `<span class="sm">${esc(a.staging)}</span>`)}
      <div class="hd" style="margin:.7rem 0 0"><div class="sp">
        <button class="g" id="toReview">Review the Migration</button></div></div></div>` : ''}`;

  const cb = $('#auth');
  if (cb) cb.onchange = () => { $('#doAuth').disabled = !cb.checked; };
  const da = $('#doAuth');
  if (da) da.onclick = () => {
    a.authorisation = { by: ME, at: now(), url: a.url, account: a.id };
    logIt(a, 'Authorisation confirmed for ' + host(a.url));
    save(); toast('Authorisation recorded.'); render();
  };
  const ld = $('#load');
  if (ld) ld.onclick = () => loadMigration(a, $('#mj').value);
  const ft = $('#fetch');
  if (ft) ft.onclick = async () => {
    a.status = 'crawling'; save(); render();
    try {
      const r = await fetch('/api/import?url=' + encodeURIComponent(a.url), { headers:{ accept:'application/json' } });
      if (!r.ok) throw new Error('The importer answered ' + r.status + '.');
      loadMigration(a, await r.text());
    } catch (e) {
      a.status = a.migration ? 'issues' : 'not_started'; save(); render();
      toast("Couldn't reach the import server. Run it from a command line and paste the model.");
    }
  };
  const tr = $('#toReview'); if (tr) tr.onclick = () => go('account', a.id, 'review');
  const cl = $('#clear'); if (cl) cl.onclick = () => {
    if (!confirm('Discard this migration? The account, its authorisation and its log are kept.')) return;
    a.migration = null; a.approved = false; a.reviewed = false;
    a.pagesApproved = {}; a.resolved = {}; a.perms = {}; a.dup = {};
    a.status = 'not_started';
    logIt(a, 'Migration discarded');
    save(); toast('Migration discarded.'); render();
  };
}

/* An import is somebody else's website. Nothing off it is trusted here either. */
function loadMigration(a, text){
  let raw;
  try { raw = JSON.parse(text); }
  catch { return toast("That isn't valid JSON."); }
  if (!raw || !raw.site || !raw.report || !Array.isArray(raw.report.entries) || !raw.summary)
    return toast('That is not a Sitecraft migration model.');
  const pages = Object.keys(raw.site);
  if (!pages.length) return toast('There are no pages in that.');

  a.migration = {
    site: raw.site, design: raw.design || {}, report: raw.report,
    summary: raw.summary, library: raw.library || [], assets: raw.assets || [],
    source: raw.source || null, at: now(),
  };
  a.status = raw.report.counts.critical ? 'issues' : (raw.report.counts.total ? 'issues' : 'reconstructed');
  a.approved = false; a.reviewed = false;
  a.pagesApproved = {}; a.resolved = {};
  a.staging = stagingFor(a);
  logIt(a, `Migration loaded: ${raw.summary.pages} pages, ${raw.summary.components} components, ` +
           `${raw.report.counts.total} exceptions (${raw.report.counts.critical} critical)`);
  save();
  toast(`${raw.summary.pages} pages came across. ${raw.report.counts.total} things need a look.`);
  go('account', a.id, 'review');
}

/* ═══════════ review (§13, §15, §49) ═══════════ */
function tabReview(a){
  if (!a.migration) return void ($('#tab').innerHTML =
    `<div class="card"><div class="empty">Nothing to review until a migration has run.</div></div>`);
  const rep = a.migration.report;
  const app = canApprove(a);
  const open = rep.entries.filter(e => !resolved(a, e));
  const bySev = s => open.filter(e => e.severity === s).length;

  $('#tab').innerHTML = `
    <div class="card"><div class="ttl"><h2>Exception report</h2>
      <span class="sp">
        ${bySev('critical') ? chip(bySev('critical') + ' critical','rd') : chip('Nothing critical','gr')}
        ${bySev('warning') ? chip(bySev('warning') + ' warning','am') : ''}
        ${bySev('note') ? chip(bySev('note') + ' note') : ''}</span></div>
      <p class="sub" style="margin:0 0 .6rem">Everything Sitecraft could not confidently reproduce,
        worst first. Nobody should have to find these by clicking through every page.</p>
      ${rep.entries.length ? rep.entries.map(e => {
        const done = resolved(a, e), k = excKey(e);
        return `<div class="exc ${e.severity}${done ? ' done' : ''}">
          <span class="lb">${esc(e.label)}</span>
          <span><span class="msg">${esc(e.message)}</span>
            <span class="meta">${esc(String(e.page))}${e.detail ? ' · ' + esc(String(e.detail)) : ''}${e.count > 1 ? ' · ' + e.count + ' times' : ''}</span>
            <span class="fix">${esc(e.fix)}</span>
            ${done ? `<span class="meta">Resolved by ${esc(a.resolved[k].by)}, ${esc(when(a.resolved[k].at))}${a.resolved[k].note ? ' — ' + esc(a.resolved[k].note) : ''}</span>` : ''}</span>
          <span>${done ? `<button class="mini" data-unres="${esc(k)}">Reopen</button>`
                       : `<button class="mini" data-res="${esc(k)}">Resolve</button>`}</span>
        </div>`;
      }).join('') : '<div class="empty">Nothing needed attention.</div>'}
    </div>

    <div class="card"><div class="ttl"><h2>Acceptance</h2></div>
      ${rep.acceptance.map(c => `<div class="check ${c.pass ? 'pass' : 'fail'}">
        <span class="m">${c.pass ? '✓' : '!'}</span><span>${esc(c.name)}</span>
        <span class="d">${esc(c.detail)}</span></div>`).join('')}
      <div class="help" style="margin-top:.6rem">Sitecraft checks these. An administrator makes the decision.</div>
    </div>

    <div class="card"><div class="ttl"><h2>Pages</h2>
      <span class="sp"><button class="mini" id="allpg">Approve all</button></span></div>
      ${pagesOf(a).map(p => {
        const done = (a.pagesApproved || {})[p.key];
        const probs = rep.entries.filter(e => e.page === p.key && !resolved(a, e));
        return `<div class="pg">
          <span><span class="n">${esc(p.name)}</span>
            <span class="u">${esc(p.slug)}</span></span>
          <span class="sp">
            ${probs.length ? chip(probs.length + ' to fix', probs.some(x => x.severity === 'critical') ? 'rd' : 'am') : ''}
            ${chip(p.components.length + ' components')}
            <button class="mini" data-pg="${esc(p.key)}">Preview</button>
            <button class="mini ${done ? 'on' : ''}" data-apg="${esc(p.key)}">${done ? '✓ Approved' : 'Approve'}</button>
          </span></div>`;
      }).join('')}
    </div>

    <div class="card"><div class="ttl"><h2>Approval</h2></div>
      ${a.approved
        ? `<div class="note gr"><b>Approved for client access.</b> ${esc(when(a.approvedAt))} by ${esc(a.approvedBy)}.</div>
           <div class="hd" style="margin:.6rem 0 0"><div class="sp">
             <button class="s" id="unapprove">Withdraw Approval</button>
             <button class="g" id="goInvite">Invite the Client</button></div></div>`
        : `${app.ok ? '<div class="note gr">Everything critical is resolved and every page has been reviewed.</div>'
                    : `<div class="note am">${esc(app.why)}</div>`}
           <div class="hd" style="margin:.6rem 0 0"><div class="sp">
             <button class="g" id="approve"${app.ok ? '' : ' disabled'}>Approve Site for Client Access</button>
           </div></div>`}
    </div>`;

  document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => resolveModal(a, b.dataset.res));
  document.querySelectorAll('[data-unres]').forEach(b => b.onclick = () => {
    delete a.resolved[b.dataset.unres];
    if (a.approved){ a.approved = false; a.status = 'issues'; logIt(a, 'Approval withdrawn: an exception was reopened'); }
    logIt(a, 'Exception reopened: ' + b.dataset.unres.split('|')[0]);
    save(); render();
  });
  document.querySelectorAll('[data-apg]').forEach(b => b.onclick = () => {
    const k = b.dataset.apg;
    a.pagesApproved = a.pagesApproved || {};
    if (a.pagesApproved[k]) delete a.pagesApproved[k]; else a.pagesApproved[k] = true;
    a.reviewed = true;
    logIt(a, (a.pagesApproved[k] ? 'Page approved: ' : 'Page approval withdrawn: ') + k);
    save(); render();
  });
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => previewModal(a, b.dataset.pg));
  $('#allpg').onclick = () => {
    pagesOf(a).forEach(p => { a.pagesApproved[p.key] = true; });
    a.reviewed = true; logIt(a, 'All pages approved');
    save(); toast('Every page marked reviewed.'); render();
  };
  const ap = $('#approve');
  if (ap) ap.onclick = () => {
    const c = canApprove(a);
    if (!c.ok) return toast(c.why);
    a.approved = true; a.approvedAt = now(); a.approvedBy = ME; a.status = 'approved';
    logIt(a, 'Site approved for client access');
    save(); toast('Approved. The client can be invited now.'); render();
  };
  const un = $('#unapprove');
  if (un) un.onclick = () => {
    a.approved = false; a.status = 'review';
    logIt(a, 'Approval withdrawn');
    save(); render();
  };
  const gi = $('#goInvite'); if (gi) gi.onclick = () => go('account', a.id, 'client');
}

function resolveModal(a, key){
  const e = a.migration.report.entries.find(x => excKey(x) === key);
  modal(`<h2>Resolve this exception</h2>
    <p class="sub">${esc(e.label)} · ${esc(String(e.page))}</p>
    <div class="note am">${esc(e.message)}<br><b>${esc(e.fix)}</b></div>
    <label for="rn">What was done</label>
    <input class="fld" id="rn" placeholder="Uploaded the picture, kept the Calendly embed, …">
    <div class="help">Recorded against the account with your name. Resolving is a judgement, not a check:
      Sitecraft cannot verify a fix it did not make.</div>`,
    [['Cancel', null], ['Mark Resolved', () => {
      a.resolved = a.resolved || {};
      a.resolved[key] = { by: ME, at: now(), note: ($('#rn').value || '').trim() };
      logIt(a, 'Exception resolved: ' + e.label + ' on ' + e.page +
               (($('#rn').value || '').trim() ? ' — ' + $('#rn').value.trim() : ''));
      save(); render();
    }]]);
}

/* ═══════════ editing permissions (§19, §26) ═══════════ */
function tabEditing(a){
  if (!a.migration) return void ($('#tab').innerHTML =
    `<div class="card"><div class="empty">Nothing to configure until a migration has run.</div></div>`);
  $('#tab').innerHTML = `
    <div class="card"><div class="ttl"><h2>What the client may change</h2></div>
      <div class="note gr"><b>Nothing is editable unless it is turned on here.</b>
        Sitecraft has no "everything except" list, and no field anywhere for a font, a width, a colour,
        a breakpoint or a stylesheet. Those are not restricted; they are simply not part of a component.</div>
      <div class="help">${esc(LOCKED)}</div>
    </div>
    ${pagesOf(a).map(p => `<div class="card">
      <div class="ttl"><h2>${esc(p.name)}</h2><span class="sp"><span class="chip">${esc(p.slug)}</span></span></div>
      ${p.components.map(c => {
        const def = LIBRARY[c.type];
        if (!def) return '';
        const keys = Object.keys(def.fields);
        return `<div class="comp">
          <div class="ch"><span class="ty">${esc(def.label)}</span>
            <span class="tx">${esc(compText(c)) || '<i style="color:var(--faint)">no text</i>'}</span>
            ${def.dup ? `<button class="mini ${isDup(a, c) ? 'on' : ''}" data-dup="${esc(c.id)}">${isDup(a, c) ? '✓ Duplicatable' : 'Not duplicatable'}</button>`
                      : `<span class="chip">Cannot be duplicated</span>`}</div>
          ${keys.length ? `<div class="fl">${keys.map(k =>
            `<button class="mini ${isEditable(a, c, k) ? 'on' : ''}" data-f="${esc(c.id)}|${esc(k)}">${
              isEditable(a, c, k) ? '✓ ' : ''}${esc(def.fields[k])}</button>`).join('')}</div>`
            : '<div class="locked">Nothing on this component is a client’s to change.</div>'}
        </div>`;
      }).join('')}
    </div>`).join('')}`;

  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const [id, k] = b.dataset.f.split('|');
    a.perms = a.perms || {}; a.perms[id] = a.perms[id] || {};
    if (a.perms[id][k] === false) delete a.perms[id][k]; else a.perms[id][k] = false;
    if (!Object.keys(a.perms[id]).length) delete a.perms[id];
    logIt(a, (isEditableRaw(a, id, k) ? 'Field opened: ' : 'Field locked: ') + id + '.' + k);
    save(); render();
  });
  document.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => {
    const id = b.dataset.dup;
    a.dup = a.dup || {};
    if (a.dup[id] === false) delete a.dup[id]; else a.dup[id] = false;
    logIt(a, (a.dup[id] === false ? 'Duplication turned off: ' : 'Duplication turned on: ') + id);
    save(); render();
  });
}
const isEditableRaw = (a, id, k) => !(a.perms && a.perms[id] && a.perms[id][k] === false);

/* ═══════════ the client (§20) ═══════════ */
function tabClient(a){
  const inv = INVITE[a.invite || 'not_invited'];
  const can = canInvite(a);
  $('#tab').innerHTML = `
    <div class="card"><div class="ttl"><h2>Client access</h2>
      <span class="sp">${chip(inv.label, inv.cls)}</span></div>
      ${rowOf('Who', esc(a.contactFirst + ' ' + a.contactLast) + `<span class="sm">${esc(a.email)}</span>`)}
      ${rowOf('Their website', a.migration ? `<span class="sm">${esc(a.staging)}</span>`
        : '<span class="sm"><i>nothing yet</i></span>')}
      ${rowOf('Invited', esc(when(a.invitedAt)))}
      ${rowOf('Activated', esc(when(a.activatedAt)))}
      ${!can.ok ? `<div class="note am">${esc(can.why)}</div>` : ''}
      <div class="hd" style="margin:.8rem 0 0"><div class="sp">
        ${a.invite === 'not_invited' || !a.invite
          ? `<button class="g" id="inv"${can.ok ? '' : ' disabled'}>Invite Client</button>`
          : ''}
        ${a.invite === 'sent' ? `<button class="s" id="resend">Resend Invitation</button>
                                 <button class="s" id="markact">Mark as Activated</button>
                                 <button class="s" id="cancel">Cancel Invitation</button>` : ''}
        ${a.invite === 'activated' ? `<button class="s" id="susp">Suspend Client</button>` : ''}
        ${a.invite === 'suspended' ? `<button class="g" id="unsusp">Restore Client</button>` : ''}
        ${a.invite === 'cancelled' ? `<button class="g" id="inv2"${can.ok ? '' : ' disabled'}>Invite Again</button>` : ''}
      </div></div>
    </div>
    <div class="card"><div class="ttl"><h2>Tenancy</h2></div>
      <div class="note am"><b>A client sees their own website and nothing else.</b>
        Not another client's site, assets, users, drafts, analytics, revision records or settings.
        That isolation belongs to the server, which does not exist yet — so until it does, do not
        put two clients' data in one place and rely on the interface to keep them apart.</div>
    </div>
    <div class="card"><div class="ttl"><h2>The account itself</h2></div>
      ${rowOf('Status', a.account === 'suspended' ? chip('Suspended','rd') : chip('Active','gr'),
        a.account === 'suspended'
          ? '<button class="mini" id="unsuspA">Restore</button>'
          : '<button class="mini" id="suspA">Suspend</button>')}
      ${rowOf('Created', esc(when(a.createdAt)))}
    </div>`;

  const invite = () => {
    const c = canInvite(a);
    if (!c.ok) return toast(c.why);
    a.invite = 'sent'; a.invitedAt = now(); a.status = 'client_ready';
    logIt(a, 'Invitation sent to ' + a.email);
    save();
    toast('Invitation recorded. Sending the email needs the server.');
    render();
  };
  ['inv','inv2'].forEach(k => { const b = $('#' + k); if (b) b.onclick = invite; });
  const rs = $('#resend'); if (rs) rs.onclick = () => {
    a.invitedAt = now(); logIt(a, 'Invitation resent to ' + a.email); save(); toast('Resent.'); render(); };
  const ma = $('#markact'); if (ma) ma.onclick = () => {
    a.invite = 'activated'; a.activatedAt = now(); a.lastLogin = now();
    logIt(a, 'Client activated their account'); save(); render(); };
  const cn = $('#cancel'); if (cn) cn.onclick = () => {
    a.invite = 'cancelled'; logIt(a, 'Invitation cancelled'); save(); render(); };
  const su = $('#susp'); if (su) su.onclick = () => {
    a.invite = 'suspended'; logIt(a, 'Client suspended'); save(); render(); };
  const us = $('#unsusp'); if (us) us.onclick = () => {
    a.invite = 'activated'; logIt(a, 'Client restored'); save(); render(); };
  const sa = $('#suspA'); if (sa) sa.onclick = () => {
    a.account = 'suspended'; logIt(a, 'Account suspended'); save(); render(); };
  const ua = $('#unsuspA'); if (ua) ua.onclick = () => {
    a.account = 'active'; logIt(a, 'Account restored'); save(); render(); };
}

/* ═══════════ revisions (§33) ═══════════ */
function revisionModal(a){
  modal(`<h2>Revisions</h2>
    <p class="sub">A revision is one publication, however many changes it carries.</p>
    <label for="al">Allowance each billing period</label>
    <input class="fld" id="al" type="number" min="0" max="99" value="${a.allowance}">
    <label for="ex">Extra revisions added by an administrator</label>
    <input class="fld" id="ex" type="number" min="0" max="99" value="${a.extra || 0}">
    <label style="display:flex;gap:.5rem;align-items:center;text-transform:none;font-size:.86rem;color:var(--ink);font-weight:500;margin-top:.9rem">
      <input type="checkbox" id="ul"${a.unlimited ? ' checked' : ''}> No limit on this account</label>
    <div class="help">Used this period: ${a.used || 0}. An administrator's own changes never
      count against a client's allowance.</div>`,
    [['Reset the Period', () => {
      a.used = 0; logIt(a, 'Revision period reset'); save(); toast('Reset.'); render();
    }], ['Save', () => {
      const al = parseInt($('#al').value, 10), ex = parseInt($('#ex').value, 10);
      if (!(al >= 0 && al <= 99) || !(ex >= 0 && ex <= 99)) return toast('Numbers between 0 and 99.');
      a.allowance = al; a.extra = ex; a.unlimited = $('#ul').checked;
      logIt(a, `Revisions set: ${al} each period` + (ex ? `, ${ex} extra` : '') + (a.unlimited ? ', no limit' : ''));
      save(); render();
    }]]);
}

/* ═══════════ modal ═══════════ */
function modal(html, buttons){
  const m = $('#modal'), s = $('#scrim');
  m.innerHTML = html + `<div class="ft">${buttons.map((b, i) =>
    `<button class="${i === buttons.length - 1 ? 'g' : 's'}" data-b="${i}">${esc(b[0])}</button>`).join('')}</div>`;
  m.classList.add('on'); s.classList.add('on');
  const shut = () => { m.classList.remove('on'); s.classList.remove('on'); };
  m.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    const fn = buttons[+b.dataset.b][1];
    shut();
    if (fn) fn();
  });
  s.onclick = shut;
  const first = m.querySelector('input, textarea'); if (first) first.focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ $('#modal').classList.remove('on'); $('#scrim').classList.remove('on'); }
});
