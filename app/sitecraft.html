<title>Sitecraft Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* ═══════════════ tokens ═══════════════ */
:root{
  --site-bg:#FFFFFF; --site-ink:#1A1D21; --site-ink2:#4A5359; --site-soft:#F2F0EC; --site-accent:#1F6F5C;
  --ui:#FFFFFF; --ui-sunk:#F4F6F7; --ui-ink:#14181C; --ui-ink2:#414B53; --ui-mut:#6B7680; --ui-faint:#98A3AB;
  --rule:#E1E5E8; --rule-soft:#EDF0F2;
  --bar:#15181C; --bar-ink:#F2F4F5; --bar-mut:#8C959D; --bar-hi:#2A3037;
  --accent:#C4392C; --accent-bg:#FBEAE7; --accent-ink:#C4392C;
  --lo:#B4443A; --mid:#B07D2E; --hi:#2F7D52;
  --ins:#DCEEE3; --ins-ink:#1D5638; --del:#F9E0DD; --del-ink:#8E2C23;
  --ok:#2F7D52; --warn:#B07D2E;
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-site:"Source Serif 4",Georgia,serif;
  --sh:0 8px 34px rgba(12,16,20,.20);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --site-bg:#14181B; --site-ink:#E9EDEF; --site-ink2:#AFB9C0; --site-soft:#1D2226; --site-accent:#6FB9A4;
  --ui:#1A1F23; --ui-sunk:#232A2F; --ui-ink:#E9EDEF; --ui-ink2:#BDC7CE; --ui-mut:#8B959D; --ui-faint:#6A757D;
  --rule:#2D343A; --rule-soft:#252C31;
  --bar:#0B0E11; --bar-ink:#F2F4F5; --bar-mut:#7E888F; --bar-hi:#242B31;
  --accent:#E8796A; --accent-bg:#38211E; --accent-ink:#E8796A;
  --lo:#DE7C72; --mid:#D2A15E; --hi:#6FB98C;
  --ins:#1C3527; --ins-ink:#8FD3AC; --del:#38211E; --del-ink:#E89A92;
  --ok:#6FB98C; --warn:#D2A15E;
  --sh:0 8px 34px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --site-bg:#14181B; --site-ink:#E9EDEF; --site-ink2:#AFB9C0; --site-soft:#1D2226; --site-accent:#6FB9A4;
  --ui:#1A1F23; --ui-sunk:#232A2F; --ui-ink:#E9EDEF; --ui-ink2:#BDC7CE; --ui-mut:#8B959D; --ui-faint:#6A757D;
  --rule:#2D343A; --rule-soft:#252C31;
  --bar:#0B0E11; --bar-ink:#F2F4F5; --bar-mut:#7E888F; --bar-hi:#242B31;
  --accent:#E8796A; --accent-bg:#38211E; --accent-ink:#E8796A;
  --lo:#DE7C72; --mid:#D2A15E; --hi:#6FB98C;
  --ins:#1C3527; --ins-ink:#8FD3AC; --del:#38211E; --del-ink:#E89A92;
  --ok:#6FB98C; --warn:#D2A15E;
  --sh:0 8px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--site-bg);color:var(--site-ink);font-family:var(--f-site);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:7rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════ the client's own website ═══════════════ */
nav.site{display:flex;align-items:center;gap:1.4rem;padding:1rem 2rem;border-bottom:1px solid var(--rule);position:relative;flex-wrap:wrap}
nav.site .logo{font-family:var(--f-ui);font-weight:800;letter-spacing:-.02em;font-size:1.05rem;margin-right:auto}
nav.site a{font-family:var(--f-ui);font-size:.86rem;font-weight:500;color:var(--site-ink2);text-decoration:none;padding:.2rem 0;border-bottom:2px solid transparent}
nav.site a.on{color:var(--site-ink);border-bottom-color:var(--site-accent)}
nav.site .nav-lock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--site-bg) 84%,transparent);font-family:var(--f-ui);font-size:.78rem;color:var(--ui-mut);gap:.4rem}
body.editing nav.site .nav-lock{display:flex}

main{max-width:52rem;margin:0 auto;padding:2.4rem 2rem 3rem}
h1.c{font-family:var(--f-site);font-size:2.15rem;line-height:1.14;letter-spacing:-.02em;font-weight:700;margin:0 0 .7rem;text-wrap:balance}
h2.c{font-family:var(--f-site);font-size:1.35rem;line-height:1.25;font-weight:600;margin:2rem 0 .6rem;text-wrap:balance}
p.c{margin:0 0 1rem;color:var(--site-ink2);font-size:1rem;line-height:1.68}
.img.c{background:var(--site-soft);border-radius:3px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:var(--ui-faint);aspect-ratio:1200/630;margin:0 0 1.2rem;text-align:center;padding:1rem}
.kick{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--site-accent);font-weight:700;margin-bottom:.5rem}

/* component affordances */
.c{position:relative;border-radius:3px;transition:box-shadow .16s,background .16s;scroll-margin:6rem}
body.pickable .c{cursor:pointer}
body.pickable .c:hover{background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent-bg)}
.c.sel{background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent)}
body.identify .c{outline:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:5px}
@keyframes flash{0%{background:var(--ins)}100%{background:transparent}}
.c.flash{animation:flash 1.5s ease-out}

.tagrow{position:absolute;top:-.62rem;right:0;display:none;gap:.3rem;z-index:6}
body.identify .tagrow,body.editing.pickable .c:hover .tagrow,.c.sel .tagrow{display:flex}
.tag{font-family:var(--f-mono);font-size:.63rem;font-weight:600;padding:.1rem .38rem;border-radius:2px;background:var(--bar);color:var(--bar-ink);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tag.paid{background:var(--ok)}
.pin{position:absolute;top:-.5rem;left:-.5rem;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--warn);color:#fff;font-family:var(--f-mono);font-size:.66rem;font-weight:700;display:grid;place-items:center;z-index:7;box-shadow:0 1px 4px rgba(0,0,0,.25)}

/* ═══════════════ floating bar ═══════════════ */
.bar{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%);background:var(--bar);border-radius:999px;display:flex;gap:.15rem;padding:.4rem;box-shadow:var(--sh);z-index:100;font-family:var(--f-ui);max-width:calc(100vw - 1.5rem)}
.bar button{border:0;background:transparent;color:var(--bar-mut);border-radius:999px;padding:.5rem .78rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.62rem;font-weight:600;letter-spacing:.02em;min-width:3.6rem;position:relative}
.bar button svg{width:1.12rem;height:1.12rem;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar button:hover{color:var(--bar-ink);background:var(--bar-hi)}
.bar button.on{background:var(--accent);color:#fff}
.bar button.lock.armed{background:var(--ok);color:#fff}
.bar .dot{position:absolute;top:.3rem;right:.55rem;min-width:.95rem;height:.95rem;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:.56rem;font-weight:700;display:grid;place-items:center;padding:0 .17rem}
.bar .sep{width:1px;background:var(--bar-hi);margin:.35rem .25rem}

/* ═══════════════ sheet ═══════════════ */
.scrim{position:fixed;inset:0;background:rgba(10,13,16,.42);z-index:70;display:none}
.scrim.open{display:block}
.scrim.open{display:block}
.sheet{position:fixed;left:50%;bottom:5.3rem;transform:translateX(-50%) translateY(calc(100% + 5.3rem));width:min(41rem,calc(100vw - 1.5rem));max-height:min(72vh,40rem);background:var(--ui);color:var(--ui-ink);border-radius:12px;box-shadow:var(--sh);z-index:80;display:grid;grid-template-rows:auto 1fr auto;font-family:var(--f-ui);transition:transform .26s cubic-bezier(.3,.8,.3,1);overflow:hidden}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sh-top{padding:.85rem 1.1rem .7rem;border-bottom:1px solid var(--rule);display:grid;gap:.3rem}
.sh-eyebrow{display:flex;align-items:center;gap:.5rem;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ui-faint)}
.sh-eyebrow .step{background:var(--ui-sunk);padding:.1rem .38rem;border-radius:2px;color:var(--ui-mut);font-weight:600}
.sh-eyebrow .x{margin-left:auto;border:0;background:transparent;color:var(--ui-mut);font-size:1.15rem;line-height:1;padding:0 .2rem}
.sh-top h2{margin:0;font-size:1.06rem;font-weight:700;letter-spacing:-.015em}
.sh-top p{margin:0;font-size:.84rem;color:var(--ui-mut);line-height:1.45}
.sh-body{overflow-y:auto;padding:.95rem 1.1rem;display:flex;flex-direction:column;gap:.8rem}
.sh-foot{padding:.75rem 1.1rem;border-top:1px solid var(--rule);display:flex;align-items:center;gap:.6rem;background:var(--ui)}
.sh-foot .hint{font-size:.75rem;color:var(--ui-faint);line-height:1.35}

.btn{border:1px solid var(--rule);background:var(--ui);color:var(--ui-ink2);padding:.55rem .9rem;border-radius:5px;font-size:.85rem;font-weight:600}
.btn:hover{border-color:var(--ui-mut)}
.btn-go{background:var(--accent);border-color:var(--accent);color:#fff;margin-left:auto}
.btn-go:hover{filter:brightness(1.07)}
.btn-go[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn-dark{background:var(--bar);border-color:var(--bar);color:var(--bar-ink);margin-left:auto}
.btn-sm{padding:.34rem .6rem;font-size:.78rem}

/* ═══════════════ before / after ═══════════════ */
.ba{display:grid;gap:.32rem}
.ba-lab{display:flex;align-items:center;gap:.45rem;font-family:var(--f-mono);font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ui-faint)}
.ba-lab .n{margin-left:auto;letter-spacing:0}
.copy{font-family:var(--f-site);font-size:.93rem;line-height:1.6;padding:.62rem .75rem;border-radius:4px;border:1px solid var(--rule-soft);background:var(--ui-sunk);color:var(--ui-mut)}
.copy.now{border-style:dashed}
.copy.up{background:var(--ui);border-color:var(--accent);color:var(--ui-ink);box-shadow:0 0 0 3px var(--accent-bg)}
.copy ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px;padding:0 .1rem}
.copy del{background:var(--del);color:var(--del-ink);border-radius:2px;padding:0 .1rem}

/* score meters */
.scores{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.score{background:var(--ui)}
.score-hd{width:100%;border:0;background:transparent;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:.6rem;padding:.58rem .7rem;text-align:left}
.score-nm{font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.score-nm .chev{color:var(--ui-faint);font-size:.62rem;transition:transform .18s}
.score-hd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.meter{display:flex;gap:2px;width:6.5rem}
.meter i{flex:1;height:.42rem;border-radius:1px;background:var(--rule);display:block}
.meter i.f{background:var(--g)}
.meter i.gain{background:var(--g);opacity:.42}
.score-num{font-family:var(--f-mono);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:4.6rem;text-align:right}
.score-num b{color:var(--g)}
.score-num s{color:var(--ui-faint);text-decoration:none}
.score-why{padding:0 .7rem .65rem;font-size:.81rem;color:var(--ui-mut);line-height:1.5;max-width:60ch}
.score-why[hidden]{display:none}
.score-why strong{color:var(--ui-ink2);font-weight:600}

.price{display:flex;align-items:center;gap:.55rem;padding:.6rem .75rem;background:var(--ui-sunk);border-radius:5px;font-size:.85rem}
.price .amt{font-family:var(--f-mono);font-weight:700;font-size:1.02rem;margin-left:auto}
.price .sub{font-size:.75rem;color:var(--ui-faint)}

/* editor */
.ed{font-family:var(--f-site);font-size:.95rem;line-height:1.6;padding:.65rem .78rem;border:1px solid var(--accent);border-radius:4px;background:var(--ui);color:var(--ui-ink);min-height:4rem;outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
.wc{display:flex;align-items:center;gap:.4rem;font-family:var(--f-mono);font-size:.72rem;color:var(--ui-mut)}
.wc b{font-weight:600}
.wc.bad{color:var(--accent-ink)}
.wc.good{color:var(--ok)}
.locknote{font-size:.78rem;color:var(--ui-faint);display:flex;gap:.4rem;align-items:flex-start;line-height:1.4}

/* lists */
.grp{border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.grp-hd{width:100%;border:0;background:var(--ui-sunk);display:flex;align-items:center;gap:.55rem;padding:.6rem .75rem;text-align:left;font-size:.87rem;font-weight:600}
.grp-hd .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--ui-mut);font-weight:500}
.grp-hd .chev{color:var(--ui-faint);font-size:.62rem;transition:transform .18s}
.grp-hd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grp-bd{display:grid;gap:1px;background:var(--rule-soft)}
.grp-bd[hidden]{display:none}
.row{background:var(--ui);padding:.55rem .75rem;display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:baseline;font-size:.83rem}
.row .where{font-family:var(--f-mono);font-size:.65rem;color:var(--ui-faint);white-space:nowrap}
.row .what{color:var(--ui-ink2);min-width:0}
.row .what em{font-style:normal;color:var(--ui-faint)}
.row .amt{font-family:var(--f-mono);font-size:.76rem;font-weight:600;color:var(--ok);white-space:nowrap}
.row input[type=checkbox]{margin:0;align-self:center}
.empty{padding:1.5rem 1rem;text-align:center;color:var(--ui-faint);font-size:.83rem;background:var(--ui)}

.tot{display:flex;align-items:center;gap:.6rem;padding:.7rem .8rem;border:1px solid var(--rule);border-radius:5px;background:var(--ui-sunk);font-size:.86rem;font-weight:600}
.tot .amt{margin-left:auto;font-family:var(--f-mono);font-size:1.1rem;font-weight:700}
.tot.plan{background:var(--ui);font-weight:500;color:var(--ui-mut)}
.tot.plan .amt{color:var(--ui-ink);font-size:.95rem}

.note-in{width:100%;font-family:var(--f-ui);font-size:.87rem;padding:.6rem .7rem;border:1px solid var(--accent);border-radius:4px;background:var(--ui);color:var(--ui-ink);resize:vertical;min-height:4.5rem;box-shadow:0 0 0 3px var(--accent-bg)}
.who{display:flex;gap:.4rem;flex-wrap:wrap}
.who button{border:1px solid var(--rule);background:var(--ui);padding:.32rem .62rem;border-radius:999px;font-size:.78rem;font-weight:500;color:var(--ui-mut)}
.who button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.thread{display:grid;gap:.4rem;padding:.55rem .75rem;background:var(--ui)}
.msg{font-size:.82rem;line-height:1.45;padding:.45rem .6rem;border-radius:4px;background:var(--ui-sunk)}
.msg .m-who{font-family:var(--f-mono);font-size:.64rem;color:var(--ui-faint);display:block;margin-bottom:.15rem}
.msg.them{background:var(--accent-bg)}

.learn{display:flex;gap:.55rem;align-items:flex-start;padding:.6rem .72rem;background:var(--ins);border-radius:5px;font-size:.81rem;color:var(--ins-ink);line-height:1.45}
.learn b{display:block;font-weight:700;margin-bottom:.1rem}
.learn button{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;padding:.25rem .55rem;border-radius:4px;font-size:.75rem;font-weight:600;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:5.3rem;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:.55rem .9rem;border-radius:6px;font-family:var(--f-ui);font-size:.82rem;box-shadow:var(--sh);z-index:105;display:flex;gap:.75rem;align-items:center;max-width:calc(100vw - 2rem)}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:var(--bar-ink);text-decoration:underline;font-size:.78rem;font-weight:700;opacity:.9}

.banner{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#1a1206;font-family:var(--f-ui);font-size:.78rem;font-weight:600;padding:.4rem 1rem;text-align:center;z-index:55;display:none}
body.editing .banner{display:block}
body.editing nav.site{margin-top:1.7rem}
</style>

<div class="banner" id="banner">Editing — press <b>Done</b> to save and unlock page navigation</div>

<!-- ══════════ the client's website ══════════ -->
<nav class="site">
  <span class="logo">Northgate Family Dental</span>
  <a href="#" data-go="home" class="on">Home</a>
  <a href="#" data-go="services">Services</a>
  <a href="#" data-go="about">About</a>
  <div class="nav-lock">🔒 Navigation locked while editing — press Done</div>
</nav>

<main id="page"></main>

<!-- ══════════ floating bar ══════════ -->
<div class="bar" role="toolbar" aria-label="Sitecraft">
  <button id="b-acct" data-mode="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.2-5.2 7.5-5.2S18.1 16.4 19.5 20"/></svg>Account</button>
  <button id="b-edit" data-mode="edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14.5 5.5 18.5 9.5"/></svg>Edit</button>
  <button id="b-notes" data-mode="notes"><svg viewBox="0 0 24 24"><path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5v-15A2.5 2.5 0 0 1 7.5 3h10A2.5 2.5 0 0 1 20 5.5z"/></svg>Notes<span class="dot" id="d-notes" hidden></span></button>
  <button id="b-review" data-mode="review"><svg viewBox="0 0 24 24"><path d="M9 4h9.5A1.5 1.5 0 0 1 20 5.5V20H9z"/><path d="M4 7.5h5V20H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M12 9h5M12 12.5h5"/></svg>Review<span class="dot" id="d-review" hidden></span></button>
  <button id="b-ident" data-mode="identify"><svg viewBox="0 0 24 24"><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6"/></svg>Identify</button>
  <span class="sep"></span>
  <button id="b-done" class="lock"><svg viewBox="0 0 24 24" id="lock-icon"><rect x="5" y="10.5" width="14" height="9.5" rx="1.8"/><path d="M8.4 10.5V7.6a3.6 3.6 0 0 1 7.2 0v2.9"/></svg>Done</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="sh-top">
    <div class="sh-eyebrow"><span id="sh-kick">Sitecraft</span><span class="step" id="sh-step" hidden></span><button class="x" id="sh-x" aria-label="Close">&times;</button></div>
    <h2 id="sh-title">—</h2>
    <p id="sh-sub"></p>
  </div>
  <div class="sh-body" id="sh-body"></div>
  <div class="sh-foot" id="sh-foot"></div>
</div>

<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>

<script>
/* ══════════════════ site content ══════════════════ */
const SITE = {
  home: { name:'Home', comps:[
    { id:'h-k',  t:'kick',  price:1, text:'Northgate · Seattle' },
    { id:'h-h1', t:'h1',    price:3, text:'Gentle Family Dentistry in Northgate, Seattle',
      up:'Same-Day Crowns and Gentle Family Dentistry in Northgate, Seattle',
      s:[3,2,5],u:[8,8,9] },
    { id:'h-p1', t:'p',     price:3, text:'We have been caring for families across North Seattle since 2004. Same-day crowns, clear aligners, and emergency appointments — with a team that remembers your name.',
      up:'We have cared for families across North Seattle since 2004. You can get a same-day crown, clear aligners, or an emergency appointment — from a team that remembers your name.',
      s:[5,4,6],u:[9,8,8] },
    { id:'h-img',t:'img',   price:2, text:'Waiting room, 1200 × 630', alt:'Northgate Family Dental waiting room',
      up:'Gentle family dentistry in Northgate Seattle — the Northgate Family Dental waiting room', s:[2,2,3],u:[8,9,8] },
    { id:'h-h2', t:'h2',    price:2, text:'Our Services',
      up:'Same-Day Crowns Mean You Leave With Your Tooth Restored', s:[1,1,3],u:[9,9,8] },

const S = {

const pageOf = id => Object.keys(SITE).find(k => SITE[k].comps.some(c=>c.id===id));
const spend = () => S.boosts.reduce((t,b)=>t+b.price,0);
const meterColor = v => v>=8 ? 'var(--hi)' : v>=5 ? 'var(--mid)' : 'var(--lo)';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* word-level diff */
function diff(a,b){
  const A=a.split(/(\s+)/), B=b.split(/(\s+)/), n=A.length, m=B.length;
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];const push=(t,x)=>{const p=out[out.length-1];if(p&&p.t===t)p.x+=x;else out.push({t,x});};
  let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){push('=',A[i]);i++;j++;} else if(L[i+1][j]>=L[i][j+1]){push('-',A[i]);i++;} else {push('+',B[j]);j++;} }
  while(i<n)push('-',A[i++]); while(j<m)push('+',B[j++]);
  return out;
}
const render = (d,keep) => d.filter(p=>p.t==='='||p.t===keep)
  .map(p=>p.t==='='?esc(p.x):`<${keep==='+'?'ins':'del'}>${esc(p.x)}</${keep==='+'?'ins':'del'}>`).join('');

function drawPage(){

    const tag = c.t==='kick' ? '' : `<span class="tagrow">
        ${noteN?'':''}

      </span>`;
    const pin = noteN ? `<span class="pin" title="${noteN} note(s)">${noteN}</span>` : '';
    if (c.t==='img') return `<div class="img c" data-id="${c.id}">${pin}${tag}${esc(txt)}</div>`;
    if (c.t==='kick') return `<p class="kick c" data-id="${c.id}">${pin}${esc(txt)}</p>`;
    return `<${c.t} class="c" data-id="${c.id}">${pin}${tag}${esc(txt)}</${c.t}>`;
  }).join('');
  document.querySelectorAll('nav.site a').forEach(a=>a.classList.toggle('on', a.dataset.go===S.page));
  document.querySelectorAll('.c').forEach(el=>{
    el.addEventListener('click', e=>{

      e.preventDefault(); e.stopPropagation();

    });

}
function badges(){
  const n = S.notes.length, r = S.changes.length + S.boosts.length;

/* ══════════════════ sheet plumbing ══════════════════ */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet({kick,title,sub,step,body,foot}){
  document.getElementById('sh-kick').textContent = kick || 'Sitecraft';
  document.getElementById('sh-title').textContent = title || '';
  document.getElementById('sh-sub').textContent = sub || '';
  const st = document.getElementById('sh-step');
  st.hidden = !step; if (step) st.textContent = step;
  document.getElementById('sh-body').innerHTML = body || '';
  document.getElementById('sh-foot').innerHTML = foot || '';
  document.getElementById('toast').hidden = true;
  clearTimeout(toast._t);
  sheet.classList.add('open'); scrim.classList.add('open');
  wireCollapse();
}
function closeSheet(){
  sheet.classList.remove('open'); scrim.classList.remove('open');
  S.sel = null; S.draft = null; S.step = 1;
  document.querySelectorAll('.c.sel').forEach(e=>e.classList.remove('sel'));
}
function wireCollapse(){
  document.querySelectorAll('[data-toggle]').forEach(b=>{
    b.onclick = () => {
      const t = document.getElementById(b.dataset.toggle);
      const open = b.getAttribute('aria-expanded')==='true';
      b.setAttribute('aria-expanded', String(!open));
      t.hidden = open;
    };
  });
}
function toast(msg, undo){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  const u = document.getElementById('toast-undo');
  u.style.display = undo ? '' : 'none'; u.onclick = () => { undo && undo(); t.hidden = true; };
  t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 4500);
}

/* ══════════════════ mode switching ══════════════════ */
function setMode(m){
  S.mode = S.mode===m ? null : m;
  document.querySelectorAll('.bar button[data-mode]').forEach(b=>b.classList.toggle('on', b.dataset.mode===S.mode));
  const picking = S.mode==='edit' || S.mode==='notes' || S.mode==='identify';
  document.body.classList.toggle('pickable', picking);
  document.body.classList.toggle('identify', S.mode==='identify');
  if (picking) enterEditing();
  closeSheet();
  if (S.mode==='review') showReview();
  if (S.mode==='account') showAccount();
  if (S.mode==='identify') showIdentify();
  if (S.mode==='edit') toast('Edit mode — click any part of your page to change it');
  if (S.mode==='notes') toast('Notes mode — click any part of your page to leave a note');
}
function enterEditing(){
  if (S.editing) return;
  S.editing = true;
  document.body.classList.add('editing');
  document.getElementById('b-done').classList.add('armed');
}
function done(){
  if (!S.editing){ toast('Nothing to save — you are already unlocked'); return; }
  S.editing = false; S.mode = null;
  document.body.classList.remove('editing','pickable','identify');
  document.querySelectorAll('.bar button[data-mode]').forEach(b=>b.classList.remove('on'));
  document.getElementById('b-done').classList.remove('armed');
  closeSheet();
  toast('Saved and locked. You can move between pages again.');
}

/* ══════════════════ pick a component ══════════════════ */
function pick(id){
  S.sel = id;
  document.querySelectorAll('.c.sel').forEach(e=>e.classList.remove('sel'));
  const el = document.querySelector(`[data-id="${id}"]`);
  el && el.classList.add('sel');
  if (S.mode==='notes') return noteSheet(id);
  return editSheet(id);
}

/* ── step 1 of edit: what do you want to do ── */
function editSheet(id){

          <span style="font-weight:400;font-size:.79rem;color:var(--ui-mut)">Free. Must stay ${c.t==='img'?'the same image size':'at '+words(c.text)+' words'} so your layout does not break.</span>
        </button>

}
const label = c => ({h1:'main heading',h2:'section heading',p:'paragraph',img:'image',kick:'label'})[c.t];

/* ── free rewrite, word count enforced ── */
function rewriteSheet(id){
  const c = comp(id);
  const target = words(c.text);
  if (c.t==='img'){
    openSheet({ kick:'Edit', step:'Step 2 of 2', title:'Replace this image',
      sub:'Your replacement has to be the same size, so the page layout stays intact.',
      body:`<div class="locknote">🔒<span>This slot is <b>1200 × 630</b>. Sitecraft only accepts an image with those exact dimensions — that is what keeps your page from breaking.</span></div>
        <div class="img" style="margin:0">${esc(c.text)}</div>
        <div class="price"><span>Upload a replacement</span><span class="sub">1200 × 630 only</span></div>`,
      foot:`<button class="btn" id="bk">Back</button><button class="btn btn-go" disabled>Choose file</button>` });
    document.getElementById('bk').onclick = () => editSheet(id);
    return;
  }
  openSheet({
    kick:'Edit', step:'Step 2 of 2', title:'Change the wording',
    sub:`Keep it to ${target} words and your page layout will not shift.`,
    body:`<div class="ba"><div class="ba-lab">Your text</div>
        <div class="ed" contenteditable="true" id="ed">${esc(c.text)}</div>
        <div class="wc" id="wc"></div></div>
      <div class="locknote">🔒<span>The word count is locked to <b>${target}</b>. This is the one rule Sitecraft enforces — it is what stops an edit from breaking your design.</span></div>`,
    foot:`<button class="btn" id="bk">Back</button><button class="btn btn-go" id="sv">Save</button>`
  });
  const ed = document.getElementById('ed'), wc = document.getElementById('wc'), sv = document.getElementById('sv');
  const tick = () => {
    const n = words(ed.innerText);
    const ok = n===target;
    wc.className = 'wc ' + (ok?'good':'bad');
    wc.innerHTML = ok ? `<b>${n} / ${target} words</b> — good to save`
      : `<b>${n} / ${target} words</b> — ${n>target?(n-target)+' too many':(target-n)+' more needed'}`;
    sv.disabled = !ok;
  };
  ed.addEventListener('input', tick); tick(); ed.focus();
  document.getElementById('bk').onclick = () => editSheet(id);
  sv.onclick = () => {
    const was = c.text, now = ed.innerText.trim();
    if (words(now)!==target) return;
    c.text = now;
    S.changes.push({ id, page:pageOf(id), what:`${label(c)} reworded`, was, now });
    closeSheet(); drawPage(); flash(id);
    toast('Saved', () => { c.text = was; S.changes.pop(); drawPage(); badges(); });
  };
}
function flash(id){
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  el.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ══════════════════ THE BOOST FLOW ══════════════════ */
function boostSheet(id){
  const c = comp(id);
  const d = diff(c.text, c.up);
  const rows = [0,1,2].map(i=>{
    const before = c.s[i], after = c.u[i], col = meterColor(after);
    const cells = Array.from({length:10},(_,k)=>{
      const cls = k<before ? 'f' : k<after ? 'gain' : '';
      return `<i class="${cls}"></i>`;
    }).join('');
    return `<div class="score" style="--g:${col}">
      <button class="score-hd" data-toggle="why${i}" aria-expanded="false">
        <span class="score-nm"><span class="chev">▶</span>${WHY[i].n}</span>
        <span class="meter">${cells}</span>
        <span class="score-num"><s>${before}</s> → <b>${after}</b>/10</span>
      </button>
      <div class="score-why" id="why${i}" hidden>${WHY[i].d}</div>
    </div>`;
  }).join('');

  openSheet({
    kick:'Boost', step:'Step 1 of 2', title:'Here is a stronger version',
    sub:`Compare it with what you have now. Nothing is charged yet.`,
    body:`
      <div class="ba" id="pane-up">
        <div class="ba-lab">What it could say<span class="n">${c.t==='img'?'new alt text':words(c.up)+' words'}</span></div>
        <div class="copy up">${render(d,'+')}</div>
      </div>
      <div class="ba" id="pane-now" hidden>
        <div class="ba-lab">What it says now<span class="n">${c.t==='img'?'current alt text':words(c.text)+' words'}</span></div>
        <div class="copy now">${render(d,'-')}</div>
      </div>
      <button class="btn btn-sm" id="flip" style="justify-self:start">Show me my original</button>
      <div class="scores">${rows}</div>
      <div class="price"><span>Boost this ${label(c)}</span><span class="sub">one-off</span><span class="amt">${money(c.price)}</span></div>`,
    foot:`<button class="btn" id="bk">Back</button><button class="btn btn-go" id="nx">Continue</button>`
  });

  let showing = 'up';
  document.getElementById('flip').onclick = (e) => {
    showing = showing==='up' ? 'now' : 'up';
    document.getElementById('pane-up').hidden = showing==='now';
    document.getElementById('pane-now').hidden = showing==='up';
    e.target.textContent = showing==='up' ? 'Show me my original' : 'Show the boosted version';
  };
  document.getElementById('bk').onclick = () => editSheet(id);
  document.getElementById('nx').onclick = () => S.skipConfirm ? applyBoost(id) : confirmSheet(id);
}

function confirmSheet(id){
  const c = comp(id);
  openSheet({
    kick:'Boost', step:'Step 2 of 2', title:`Boost this ${label(c)} for ${money(c.price)}?`,
    sub:'This replaces the wording on your live page. You can undo it straight after.',
    body:`
      <div class="ba"><div class="ba-lab">Going live</div><div class="copy up">${esc(c.up)}</div></div>
      <div class="price"><span>This boost</span><span class="amt">${money(c.price)}</span></div>
      <div class="tot plan"><span>Boosts this month</span><span class="amt">${money(spend())}</span></div>
      <div class="tot plan"><span>Subscription</span><span class="amt">$299.00 / mo</span></div>`,
    foot:`<button class="btn" id="bk">Back</button><button class="btn btn-go" id="go">Boost for ${money(c.price)}</button>`
  });
  document.getElementById('bk').onclick = () => boostSheet(id);
  document.getElementById('go').onclick = () => applyBoost(id);
}

function applyBoost(id){
  const c = comp(id);
  const was = c.text;
  c.text = c.up;
  S.boosts.push({ id, page:pageOf(id), price:c.price, what:label(c), gain:c.u.map((v,i)=>v-c.s[i]) });
  S.boostCount++;
  closeSheet(); drawPage(); flash(id); badges();
  toast(`Boosted for ${money(c.price)}`, () => {
    c.text = was; S.boosts.pop(); S.boostCount--; drawPage(); badges();
  });
  if (S.boostCount===3 && !S.skipConfirm && !S.offered) { S.offered = true; setTimeout(offerSkip, 1200); }
}

/* the system watching for a habit and offering to shorten the flow */
function offerSkip(){

    kick:'Sitecraft', title:'Want to skip the confirmation step?',
    sub:'You have boosted three times and confirmed every one.',
    body:`<div class="learn"><span>⚡</span><span><b>We noticed a habit</b>From now on, Sitecraft can boost as soon as you press Continue — one step instead of two. You will still see the comparison first, and you can still undo straight after.</span></div>

    foot:`<button class="btn" id="no">Keep asking me</button><button class="btn btn-go" id="yes">Skip it from now on</button>`
  });
  document.getElementById('no').onclick = () => { closeSheet(); toast('No problem — we will keep confirming.'); };
  document.getElementById('yes').onclick = () => { S.skipConfirm = true; closeSheet(); toast('Done. Boosts now apply in one step.'); };
}

  });
  document.getElementById('no').onclick = closeSheet;
  document.getElementById('yes').onclick = () => { S.seats = 2; closeSheet(); toast('Priya Raman added as a reviewer'); };
}

/* ══════════════════ review ══════════════════ */
function showReview(){
  const byPage = k => Object.keys(SITE).map(p=>{
    const items = S[k].filter(x=>x.page===p);
    if (!items.length) return '';
    return `<div class="row"><span class="where">${SITE[p].name}</span><span class="what">${items.length} item${items.length>1?'s':''}</span>${k==='boosts'?`<span class="amt">${money(items.reduce((t,i)=>t+i.price,0))}</span>`:'<span></span>'}</div>`;
  }).join('');

  const changeRows = S.changes.length ? S.changes.map(c=>
    `<div class="row"><span class="where">${SITE[c.page].name}</span><span class="what">${esc(c.what)} — <em>“${esc(c.now.slice(0,52))}${c.now.length>52?'…':''}”</em></span><span></span></div>`
  ).join('') : `<div class="empty">No wording changes yet.</div>`;

  const noteRows = S.notes.length ? S.notes.map((n,i)=>
    `<div class="row"><input type="checkbox" data-note="${i}" ${S.picked.has(i)?'checked':''}><span class="what">${esc(n.text)}<br><em>${SITE[n.page].name} · for ${esc(n.to)}${n.sent?' · sent':''}</em></span><span></span></div>`
  ).join('') : `<div class="empty">No notes yet. Use the Notes button, then click any part of your page.</div>`;

  const boostRows = S.boosts.length ? (byPage('boosts') + S.boosts.map(b=>
    `<div class="row"><span class="where">${SITE[b.page].name}</span><span class="what">${esc(b.what)} — <em>AI +${b.gain[0]}, AEO +${b.gain[1]}, SEO +${b.gain[2]}</em></span><span class="amt">${money(b.price)}</span></div>`
  ).join('')) : `<div class="empty">No boosts yet.</div>`;

  const unsent = S.notes.filter(n=>!n.sent).length;
  openSheet({
    kick:'Review', title:'Everything you have done',
    sub:'Three lists: what changed, what people need to look at, and what you have boosted.',
    body:`
      <div class="grp"><button class="grp-hd" data-toggle="g1" aria-expanded="false"><span class="chev">▶</span>Changes to wording<span class="cnt">${S.changes.length}</span></button><div class="grp-bd" id="g1" hidden>${changeRows}</div></div>
      <div class="grp"><button class="grp-hd" data-toggle="g2" aria-expanded="${unsent?'true':'false'}"><span class="chev" ${unsent?'style="transform:rotate(90deg)"':''}>▶</span>Notes<span class="cnt">${S.notes.length}${unsent?' · '+unsent+' unsent':''}</span></button>
        <div class="grp-bd" id="g2" ${unsent?'':'hidden'}>${noteRows}
        ${S.notes.length?`<div class="row" style="grid-template-columns:1fr auto"><span class="what" style="font-size:.79rem;color:var(--ui-faint)">Pick the notes you want reviewed, then send them all in one email.</span><button class="btn btn-sm" id="sendnotes">Send selected</button></div>`:''}</div></div>
      <div class="grp"><button class="grp-hd" data-toggle="g3" aria-expanded="false"><span class="chev">▶</span>Boosts<span class="cnt">${S.boosts.length} · ${money(spend())}</span></button><div class="grp-bd" id="g3" hidden>${boostRows}</div></div>
      <div class="tot"><span>Boosts this month</span><span class="amt">${money(spend())}</span></div>
      <div class="tot plan"><span>Subscription</span><span class="amt">$299.00 / mo</span></div>`,
    foot:`<span class="hint">${S.boosts.length?`Average ${money(spend()/S.boosts.length)} per boost.`:'Boost a component to see it here.'}</span><button class="btn" id="cx">Close</button>`
  });
  document.getElementById('cx').onclick = () => setMode('review');
  document.querySelectorAll('[data-note]').forEach(cb=>cb.onchange=()=>{
    const i = +cb.dataset.note;
    cb.checked ? S.picked.add(i) : S.picked.delete(i);
  });
  const sn = document.getElementById('sendnotes');
  if (sn) sn.onclick = () => {
    if (!S.picked.size) { toast('Tick the notes you want to send'); return; }
    const to = [...S.picked].map(i=>S.notes[i].to);
    const who = [...new Set(to)];
    [...S.picked].forEach(i=>{ S.notes[i].sent = true; S.notes[i].reply = 'Looks good — happy for you to publish this one.'; });
    const n = S.picked.size; S.picked.clear();
    showReview(); badges();
    toast(`${n} note${n>1?'s':''} sent to ${who.join(' and ')} in one email`);
  };
}

/* ══════════════════ account ══════════════════ */

  openSheet({
    kick:'Account', title:'Your plan',
    sub:'Northgate Family Dental · northgatefamilydental.com',

      <div class="tot"><span>Boosts this month</span><span class="amt">${money(spend())}</span></div>
      <div class="grp"><button class="grp-hd" data-toggle="a1" aria-expanded="false"><span class="chev">▶</span>People on your account<span class="cnt">${S.seats} of ${S.seats}</span></button>
        <div class="grp-bd" id="a1" hidden>
          <div class="row"><span class="where">Owner</span><span class="what">You — can edit and boost</span><span></span></div>
          ${COLL.slice(0,S.seats).map(p=>`<div class="row"><span class="where">Reviewer</span><span class="what">${esc(p)} — notes only, no edits</span><span></span></div>`).join('')}
          ${S.seats<2?`<div class="row" style="grid-template-columns:1fr auto"><span class="what" style="color:var(--ui-faint);font-size:.8rem">One reviewer is included. Extra reviewers are $9/mo.</span><button class="btn btn-sm" id="addseat">Add</button></div>`:''}
        </div></div>
      <div class="grp"><button class="grp-hd" data-toggle="a2" aria-expanded="false"><span class="chev">▶</span>How you like to work<span class="cnt">${S.skipConfirm?'1 shortcut on':'default'}</span></button>
        <div class="grp-bd" id="a2" hidden>
          <div class="row" style="grid-template-columns:1fr auto"><span class="what">Confirm before each boost<br><em>${S.skipConfirm?'Off — boosts apply as soon as you press Continue':'On — we show a confirmation step'}</em></span>
          <button class="btn btn-sm" id="flipconf">${S.skipConfirm?'Turn back on':'Turn off'}</button></div>
        </div></div>`,
    foot:`<span class="hint">Boosts are billed monthly with your subscription.</span><button class="btn" id="cx">Close</button>`
  });
  document.getElementById('cx').onclick = () => setMode('account');
  const a = document.getElementById('addseat'); if (a) a.onclick = seatsSheet;
  document.getElementById('flipconf').onclick = () => { S.skipConfirm = !S.skipConfirm; showAccount(); };
}

/* ══════════════════ identify ══════════════════ */
function showIdentify(){
  const pg = SITE[S.page];
  const list = pg.comps.filter(c=>c.up);
  const total = list.filter(c=>!S.boosts.some(b=>b.id===c.id)).reduce((t,c)=>t+c.price,0);
  openSheet({
    kick:'Identify', title:`What can be boosted on ${pg.name}`,
    sub:'Every part of your page that could score better in AI search, with what it costs.',
    body:`<div class="grp"><div class="grp-bd">${list.map(c=>{
        const done = S.boosts.some(b=>b.id===c.id);
        const now = Math.round(c.s.reduce((a,b)=>a+b,0)/3), up = Math.round(c.u.reduce((a,b)=>a+b,0)/3);
        return `<div class="row"><span class="where">${label(c)}</span>
          <span class="what">${esc(c.text.slice(0,46))}${c.text.length>46?'…':''}<br><em>now ${now}/10 → could be ${up}/10</em></span>
          <span class="amt">${done?'✓ done':money(c.price)}</span></div>`;
      }).join('')}</div></div>
      ${total?`<div class="tot"><span>Boost everything left on this page</span><span class="amt">${money(total)}</span></div>`:''}`,
    foot:`<span class="hint">Click anything on the page to boost it on its own.</span>${total?`<button class="btn btn-go" id="all">Boost whole page · ${money(total)}</button>`:'<button class="btn" id="cx">Close</button>'}`
  });
  const cx = document.getElementById('cx'); if (cx) cx.onclick = () => setMode('identify');
  const all = document.getElementById('all');
  if (all) all.onclick = () => {
    const todo = list.filter(c=>!S.boosts.some(b=>b.id===c.id));
    const snap = todo.map(c=>({c, was:c.text}));
    todo.forEach(c=>{ c.text = c.up; S.boosts.push({id:c.id,page:pageOf(c.id),price:c.price,what:label(c),gain:c.u.map((v,i)=>v-c.s[i])}); });
    S.boostCount += todo.length;
    closeSheet(); drawPage(); badges();
    toast(`Boosted ${todo.length} items for ${money(total)}`, () => {
      snap.forEach(({c,was})=>c.text=was);
      S.boosts.splice(S.boosts.length-todo.length, todo.length);
      S.boostCount -= todo.length; drawPage(); badges();
    });
  };
}

/* ══════════════════ wiring ══════════════════ */
document.querySelectorAll('.bar button[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('b-done').onclick = done;
document.getElementById('sh-x').onclick = () => { if (S.mode==='review'||S.mode==='account'||S.mode==='identify') setMode(S.mode); else closeSheet(); };
scrim.onclick = () => document.getElementById('sh-x').click();
document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('sh-x').click(); });
document.querySelectorAll('nav.site a').forEach(a=>a.onclick=e=>{
  e.preventDefault();
  if (S.editing) { toast('Press Done to save and unlock navigation'); return; }
  S.page = a.dataset.go; drawPage(); window.scrollTo({top:0,behavior:'smooth'});
});
drawPage();
</script>
