<title>Sitecraft Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════ V1 design system ═══════ */
:root{
  --navy:#16243C; --navy-2:#2C3E5C; --bar:#131A28; --bar-2:#26314A;
  --red:#C41E3A; --red-2:#E8455E;
  --green:#7EB93F; --green-d:#6BA032; --green-pale:#EAF4DC; --green-ink:#4C7A1F;
  --amber:#E2932B; --amber-bg:#FDF4E3; --amber-ink:#8A6416;
  --blue:#2563EB;
  --page:#F4F5F7; --card:#FFFFFF; --sunk:#EFF1F4; --rule:#E4E7EC; --rule-2:#EEF0F3;
  --ink:#16243C; --ink-2:#495A72; --mut:#77869B; --faint:#9AA7B8;
  --sh:0 14px 44px rgba(16,24,40,.18);
  --f:"Inter",ui-sans-serif,system-ui,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#E7ECF3; --navy-2:#B7C3D4; --bar:#0A0E16; --bar-2:#1E2739;
  --red:#F2647C; --red-2:#F2647C;
  --green:#8CC64C; --green-d:#7EB93F; --green-pale:#1E2A16; --green-ink:#A8D472;
  --amber:#E2932B; --amber-bg:#2A2113; --amber-ink:#E0B476;
  --page:#0E1319; --card:#161C25; --sunk:#1E252F; --rule:#2A3240; --rule-2:#222932;
  --ink:#E7ECF3; --ink-2:#B2BECD; --mut:#8494A6; --faint:#66748A;
  --sh:0 14px 44px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --navy:#E7ECF3; --navy-2:#B7C3D4; --bar:#0A0E16; --bar-2:#1E2739;
  --red:#F2647C; --red-2:#F2647C;
  --green:#8CC64C; --green-d:#7EB93F; --green-pale:#1E2A16; --green-ink:#A8D472;
  --amber:#E2932B; --amber-bg:#2A2113; --amber-ink:#E0B476;
  --page:#0E1319; --card:#161C25; --sunk:#1E252F; --rule:#2A3240; --rule-2:#222932;
  --ink:#E7ECF3; --ink-2:#B2BECD; --mut:#8494A6; --faint:#66748A;
  --sh:0 14px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--card);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:7rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════ the client's site ═══════ */
nav.site{display:flex;align-items:center;gap:1.5rem;padding:.9rem 2.2rem;border-bottom:1px solid var(--rule);position:relative;flex-wrap:wrap;background:var(--card)}
nav.site .lg{font-weight:800;letter-spacing:-.02em;font-size:1rem;margin-right:auto;color:var(--navy)}
nav.site a{font-size:.85rem;font-weight:500;color:var(--ink-2);text-decoration:none}
nav.site a.on{color:var(--blue);font-weight:600}
nav.site .navlock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);font-size:.78rem;font-weight:600;color:var(--amber-ink);gap:.4rem}
body.editing nav.site .navlock{display:flex}

.hero{background:var(--bar);padding:3.2rem 2.2rem;color:#fff}
.hero .in{max-width:52rem;margin:0 auto}
main{max-width:52rem;margin:0 auto;padding:2.2rem 2.2rem 3rem}
.kick{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 .6rem}
.hero .kick{color:#7FA6F5}
h1.c{font-size:2.3rem;line-height:1.1;letter-spacing:-.028em;font-weight:800;margin:0 0 .8rem;text-wrap:balance}
.hero h1.c{color:#fff}
h2.c{font-size:1.4rem;line-height:1.24;font-weight:700;letter-spacing:-.018em;margin:2rem 0 .6rem;color:var(--navy);text-wrap:balance}
p.c{margin:0 0 1rem;color:var(--ink-2);font-size:.98rem;line-height:1.7}
.hero p.c{color:#C3CEE2;max-width:44rem}
.img.c{background:var(--sunk);border-radius:4px;display:grid;place-items:center;font-family:var(--m);font-size:.7rem;color:var(--faint);aspect-ratio:1200/630;margin:0 0 1.2rem;padding:1rem;text-align:center}
.band.c{background:var(--sunk);padding:.8rem 1rem;border-radius:4px;font-size:.88rem;color:var(--mut);margin:1rem 0}

.c{position:relative;border-radius:3px;transition:box-shadow .15s;scroll-margin:7rem}
body.pick .c{cursor:pointer}
body.pick .c:hover{box-shadow:0 0 0 2px var(--blue)}
.c.sel{box-shadow:0 0 0 2px var(--blue)}
body.ident .c[data-boost]{box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 45%,transparent)}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:0 0 0 3px transparent}}
.c.fl{animation:fl 1.6s ease-out}

.etag{position:absolute;top:-.72rem;right:.2rem;display:none;gap:.25rem;z-index:6;align-items:center}
body.pick .c:hover .etag,.c.sel .etag,body.ident .c .etag{display:flex}
.etag span{font-size:.62rem;font-weight:700;padding:.14rem .4rem;border-radius:3px;background:var(--bar);color:#fff;white-space:nowrap;letter-spacing:.02em}
.etag .pr{background:var(--red)}
.etag .dn{background:var(--green-d)}
.npin{position:absolute;top:-.5rem;left:-.55rem;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--amber);color:#fff;font-size:.64rem;font-weight:800;display:grid;place-items:center;z-index:7}

/* ═══════ floating bar ═══════ */
.bar{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%);background:var(--bar);border:1px solid rgba(255,255,255,.09);border-radius:999px;display:flex;gap:.2rem;padding:.4rem;box-shadow:var(--sh);z-index:100;max-width:calc(100vw - 1rem);overflow-x:auto}
.bar button{border:0;background:transparent;color:#C7D0DE;border-radius:999px;padding:.5rem .85rem;display:flex;align-items:center;gap:.42rem;font-size:.82rem;font-weight:600;white-space:nowrap;position:relative}
.bar button svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar button:hover{background:var(--bar-2);color:#fff}
.bar button.on{background:#fff;color:var(--bar)}
.bar button.done.armed{background:var(--green);color:#fff}
.bar .bdg{background:var(--amber);color:#fff;font-size:.66rem;font-weight:800;padding:.05rem .32rem;border-radius:999px;min-width:1.1rem;text-align:center}
.bar .ses{color:var(--green);font-family:var(--m);font-size:.76rem;font-weight:600;padding:.5rem .7rem;border-left:1px solid var(--bar-2);margin-left:.15rem;display:flex;align-items:center}

/* ═══════ panel ═══════ */
.scrim{position:fixed;inset:0;background:rgba(12,18,28,.4);z-index:70;display:none}
.scrim.open{display:block}
.pan{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(27rem,calc(100vw - 1.5rem));max-height:min(82vh,46rem);background:var(--card);border-radius:14px;box-shadow:var(--sh);z-index:80;display:grid;grid-template-rows:auto 1fr;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;overflow:hidden}
.pan.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.p-hd{padding:.85rem 1.05rem .7rem;display:grid;grid-template-columns:1fr auto;gap:.25rem .6rem;border-bottom:1px solid var(--rule-2)}
.p-hd .ttl{font-size:.84rem;font-weight:700;color:var(--red);line-height:1.35;min-width:0}
.p-hd .meta{grid-column:1/-1;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.p-hd .ttl b{color:var(--navy)}
.p-hd .ttl i{font-style:normal;color:var(--mut);font-weight:500}
.p-hd .step,.p-hd .flag{font-family:var(--m);font-size:.62rem;font-weight:600;color:var(--mut);background:var(--sunk);padding:.1rem .34rem;border-radius:3px;white-space:nowrap}
.p-hd .flag{color:var(--amber-ink);background:var(--amber-bg)}
.p-x{margin-left:auto;border:0;background:transparent;color:var(--green);font-size:1.05rem;line-height:1;font-weight:800;padding:0 .1rem;flex:none}
.p-bd{overflow-y:auto;padding:.9rem 1.05rem 1.05rem;display:flex;flex-direction:column;gap:.7rem}
.p-ft{font-size:.68rem;color:var(--faint);text-align:center;padding-top:.2rem;border-top:1px solid var(--rule-2);margin-top:.15rem}
.p-ft u{cursor:pointer}

/* buttons */
.g{border:0;background:var(--green);color:#fff;padding:.6rem 1rem;border-radius:7px;font-size:.88rem;font-weight:700;text-align:center}
.g:hover{background:var(--green-d)}
.g[disabled]{background:color-mix(in srgb,var(--green) 42%,var(--card));cursor:not-allowed}
.g.wide{width:100%;padding:.72rem 1rem;font-size:.92rem}
.pill{border:1px solid var(--rule);background:var(--sunk);color:var(--ink-2);padding:.32rem .68rem;border-radius:6px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill:hover{border-color:var(--mut)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}

/* copy boxes */
.box{background:var(--sunk);border:1px solid var(--rule-2);border-radius:7px;padding:.65rem .75rem;font-size:.9rem;line-height:1.6;color:var(--ink-2)}
.box.ed{background:var(--card);border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent);color:var(--ink);outline:none}
.box ins{background:var(--green-pale);color:var(--green-ink);text-decoration:none;border-radius:2px;padding:0 .08rem}
.box del{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);border-radius:2px;padding:0 .08rem}
.lab{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:.4rem}
.lab .n{margin-left:auto;font-family:var(--m);letter-spacing:0;text-transform:none;font-weight:500}
.wc{font-family:var(--m);font-size:.72rem;font-weight:500;color:var(--mut)}
.wc.bad{color:var(--red)}.wc.ok{color:var(--green-ink)}
.help{font-size:.76rem;color:var(--mut);text-align:center;line-height:1.45}
.note-amber{background:var(--amber-bg);color:var(--amber-ink);border-radius:6px;padding:.55rem .7rem;font-size:.78rem;line-height:1.45}
.note-amber b{font-weight:700}

/* content analysis */
.ca{border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.ca-hd{width:100%;border:0;background:var(--green-pale);display:flex;align-items:center;gap:.62rem;padding:.6rem .7rem;text-align:left}
.ca-sc{width:2.05rem;height:2.05rem;border-radius:50%;background:var(--red);color:#fff;font-size:.78rem;font-weight:800;display:grid;place-items:center;flex:none;font-family:var(--m)}
.ca-hd.up .ca-sc{background:var(--green-d)}
.ca-nm{display:grid;gap:.05rem;min-width:0}
.ca-nm b{font-size:.86rem;font-weight:700;color:var(--navy)}
.ca-nm span{font-size:.73rem;color:var(--ink-2);line-height:1.35}
.ca-hd .tw{margin-left:auto;color:var(--green);font-weight:800;font-size:1rem;flex:none}
.ca-bd{padding:.75rem .7rem;display:grid;gap:.65rem;background:var(--card)}
.ca-bd[hidden]{display:none}
.ca-t{text-align:center;font-size:.84rem;font-weight:700;color:var(--navy)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.tile{background:var(--sunk);border-radius:6px;padding:.5rem .3rem;text-align:center}
.tile.up{background:var(--green-pale)}
.tile .tl{font-size:.57rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--mut);display:block;margin-bottom:.15rem;line-height:1.25}
.tile .tv{font-family:var(--m);font-size:1.15rem;font-weight:700;color:var(--red);letter-spacing:-.02em}
.tile.up .tv{color:var(--green-d)}
.tile .tu{font-size:.66rem;font-weight:600;color:var(--faint)}
.tile .tw{display:block;font-size:.53rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--green-ink);margin-top:.1rem}
.tile .tp{display:block;font-family:var(--m);font-size:.62rem;color:var(--faint);margin-top:.05rem}
.rec{font-size:.83rem;font-weight:700;color:var(--navy);text-align:center;line-height:1.45}
.rec span{color:var(--red)}

/* collapsibles */
.coll{border-top:1px solid var(--rule-2)}
.coll-hd{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:.5rem;padding:.5rem 0;text-align:left;font-size:.82rem;font-weight:700;color:var(--navy)}
.coll-hd .tw{margin-left:auto;color:var(--green);font-weight:800;font-size:.95rem}
.coll-bd{padding:0 0 .6rem;font-size:.81rem;color:var(--ink-2);line-height:1.55;display:grid;gap:.45rem}
.coll-bd[hidden]{display:none}
.coll-bd b{color:var(--navy);font-weight:700}

/* rows / lists */
.sec{display:grid;gap:.3rem}
.sec-hd{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:.5rem;padding:.45rem 0;font-size:.86rem;font-weight:700;color:var(--navy);text-align:left;border-bottom:1px solid var(--rule-2)}
.sec-hd .tw{margin-left:auto;color:var(--green);font-weight:800;font-size:.95rem}
.sec-bd{display:grid}
.sec-bd[hidden]{display:none}
.itm{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem .55rem;padding:.6rem 0;border-bottom:1px solid var(--rule-2);align-items:start}
.itm:last-child{border-bottom:0}
.itm .who{font-size:.75rem;font-weight:700;color:var(--red)}
.itm .who i{font-style:normal;color:var(--green-ink);font-weight:600}
.itm .who em{font-style:normal;color:var(--amber-ink);font-weight:600}
.itm .bdy{min-width:0;display:grid;gap:.12rem}
.itm .old{font-size:.82rem;color:var(--faint);text-decoration:line-through}
.itm .new{font-size:.85rem;color:var(--ink)}
.itm .stamp{font-size:.7rem;color:var(--faint)}
.itm .acts{display:grid;gap:.28rem;justify-items:stretch}
.itm .amt{font-family:var(--m);font-size:.86rem;font-weight:700;color:var(--navy);text-align:right;white-space:nowrap}
.itm.gone .new,.itm.gone .who{color:var(--faint);text-decoration:line-through}
.itm input[type=checkbox]{margin:.25rem 0 0;accent-color:var(--green)}
.spent{display:flex;align-items:baseline;gap:.6rem;padding-top:.6rem;font-size:.88rem;font-weight:700;color:var(--navy)}
.spent .amt{margin-left:auto;font-family:var(--m);font-size:1.35rem;font-weight:800}
.mini{font-size:.73rem;color:var(--faint);text-align:center}
.empty{padding:1.1rem .5rem;text-align:center;color:var(--faint);font-size:.8rem}

.chips{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:600;padding:.14rem .45rem;border-radius:4px;background:var(--sunk);color:var(--ink-2)}
.chip.gr{background:var(--green-pale);color:var(--green-ink)}
.chip.am{background:var(--amber-bg);color:var(--amber-ink)}
.who-pick{display:flex;gap:.35rem;flex-wrap:wrap}
.who-pick button{border:1px solid var(--rule);background:var(--card);padding:.3rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--mut)}
.who-pick button.on{border-color:var(--green);background:var(--green-pale);color:var(--green-ink)}
textarea.ta{width:100%;font-family:var(--f);font-size:.87rem;padding:.6rem .7rem;border:1px solid var(--blue);border-radius:7px;background:var(--card);color:var(--ink);resize:vertical;min-height:4.4rem;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent)}
.msg{font-size:.81rem;line-height:1.45;padding:.45rem .6rem;border-radius:6px;background:var(--sunk)}
.msg b{display:block;font-size:.68rem;color:var(--faint);font-weight:600;margin-bottom:.1rem}
.msg.them{background:var(--green-pale);color:var(--green-ink)}

.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--bar);color:#fff;padding:.6rem 1rem;border-radius:9px;font-size:.83rem;box-shadow:var(--sh);z-index:110;text-align:center;max-width:calc(100vw - 2rem);line-height:1.4}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:#9BD35F;text-decoration:underline;font-size:.8rem;font-weight:700;margin-left:.6rem}
.banner{position:fixed;top:0;left:0;right:0;background:var(--amber);color:#2A1F06;font-size:.76rem;font-weight:700;padding:.35rem 1rem;text-align:center;z-index:65;display:none}
body.editing .banner{display:block}
body.editing nav.site{margin-top:1.6rem}
</style>

<div class="banner">You are editing — press <b>Done</b> to settle up and unlock the other pages</div>

<nav class="site">
  <span class="lg">Northgate Family Dental</span>
  <a href="#" data-go="home" class="on">Home</a>
  <a href="#" data-go="services">Services</a>
  <a href="#" data-go="about">About</a>
  <div class="navlock">🔒 Locked while you are editing — press Done</div>
</nav>

<div class="hero" id="hero"></div>
<main id="page"></main>

<div class="bar" role="toolbar" aria-label="Sitecraft">
  <button data-mode="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6h.1a2 2 0 1 1 4 0V3a1.7 1.7 0 0 0 2.87 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 21 9v.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1.9z"/></svg>My Account</button>
  <button data-mode="edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14.5 5.5 18.5 9.5"/></svg>Edit</button>
  <button data-mode="comment"><svg viewBox="0 0 24 24"><path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5v-15A2.5 2.5 0 0 1 7.5 3h10A2.5 2.5 0 0 1 20 5.5z"/></svg>Comment<span class="bdg" data-bdg="notes" hidden></span></button>
  <button data-mode="review"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Review<span class="bdg" data-bdg="review" hidden></span></button>
  <button data-mode="ident"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.25-1 .8-1 1.5v.4"/><path d="M12 16.8h.01"/></svg>?</button>
  <span class="ses" id="ses" hidden></span>
  <button class="done" data-done><svg viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>Done</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="pan" id="pan" role="dialog" aria-modal="true">
  <div class="p-hd"><div class="ttl" id="p-ttl"></div><button class="p-x" id="p-x" aria-label="Close">✕</button><div class="meta" id="p-meta"></div></div>
  <div class="p-bd" id="p-bd"></div>
</div>

<div class="toast" id="toast" hidden><span id="t-msg"></span><button id="t-undo">Undo</button></div>

<script>
/* ═══════════ content ═══════════ */
const SITE = {
  home:{ name:'Home', critical:true, comps:[
    {id:'h-k', lbl:'Eyebrow', t:'kick', hero:1, price:0.99, text:'Northgate · Seattle', s:[2.0,1.5,2.5]},
    {id:'h-h1',lbl:'Heading', t:'h1', hero:1, price:5.99, text:'Gentle Family Dentistry in Northgate, Seattle',
      up:'Same-Day Crowns and Gentle Family Dentistry in Northgate, Seattle', s:[3.0,2.5,4.5], u:[8.5,9.0,8.5],
      rec:'Your heading names the service people actually search for, and gets tagged so engines know it is the page subject.'},
    {id:'h-p1',lbl:'Body copy', t:'p', hero:1, price:3.99, text:'We have been caring for families across North Seattle since 2004. Same-day crowns, clear aligners, and emergency appointments — with a team that remembers your name.',
      up:'We have cared for families across North Seattle since 2004. You can get a same-day crown, clear aligners, or an emergency appointment from a team that remembers your name.', s:[4.0,3.5,5.0], u:[8.5,8.0,8.0],
      rec:'Your paragraph gets rewritten so every sentence makes sense on its own.'},
    {id:'h-img',lbl:'Feature photo', t:'img', price:1.99, text:'Waiting room · 1200 × 630', alt:'Waiting room',

function dif(a,b){
  const A=a.split(/(\s+)/),B=b.split(/(\s+)/),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const o=[];const p=(t,x)=>{const l=o[o.length-1];if(l&&l.t===t)l.x+=x;else o.push({t,x});};
  let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){p('=',A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){p('-',A[i]);i++;}else{p('+',B[j]);j++;}}
  while(i<n)p('-',A[i++]);while(j<m)p('+',B[j++]);return o;
}

    S.boosts.pop(); S.session -= c.price; S.boostCount--; draw(); bdg();
  });
  if (S.boostCount===3 && !S.skipConfirm && !S.offered){ S.offered = true; setTimeout(offer, 1400); }
}
function offer(){
  open({ ttl:'<b>Sitecraft noticed a habit</b>', body:`
    <div class="note-amber" style="background:var(--green-pale);color:var(--green-ink)">
      You have boosted three times and said yes every time. Sitecraft can skip that confirm step from now on — you will still see the comparison first, and Undo still works straight after.</div>
    <div class="help">You can switch this back whenever you like, from My Account.</div>
    <div class="pair"><button class="pill" id="no">Keep asking me</button><button class="g" id="yes">Skip it from now on</button></div>`});
  $('#no').onclick = ()=>{ shut(); toast('No problem — Sitecraft will keep asking.'); };
  $('#yes').onclick = ()=>{ S.skipConfirm = true; shut(); toast('Done. Boosts now take one step.'); };
}

/* ═══════════ comments ═══════════ */
function noteP(id){
  const c = comp(id), mine = S.notes.filter(n=>n.id===id);
  open({ ttl: hdr(c), flag: flagOf(c), body:`
    <div class="box">${esc(c.text.slice(0,150))}${c.text.length>150?'…':''}</div>
    ${mine.length?`<div class="sec"><button class="sec-hd" data-t="nt" aria-expanded="true">Notes already here<span class="tw">✕</span></button>
      <div class="sec-bd" id="nt">${mine.map(n=>`<div style="padding:.5rem 0;display:grid;gap:.35rem">
        <div class="msg"><b>You · ${esc(n.when)}</b>${esc(n.text)}</div>
        ${n.reply?`<div class="msg them"><b>${esc(n.to)}</b>${esc(n.reply)}</div>`:''}</div>`).join('')}</div></div>`:''}
    <div class="lab">Your note</div>
    <textarea class="ta" id="tx" placeholder="e.g. Can we mention the Saturday hours here?"></textarea>
    <div class="lab">Who is it for?</div>
    <div class="who-pick" id="wp">${PEOPLE.slice(0,S.seats).map((p,i)=>`<button data-w="${esc(p)}" class="${i?'':'on'}">${esc(p)}</button>`).join('')}
      ${S.seats<2?'<button data-add="1" style="border-style:dashed">+ Add someone · $9/mo</button>':''}</div>
    <button class="g wide" id="ad">Save this note</button>
    <div class="help">Notes gather in Review, so you can send them in one go.</div>
    <div class="p-ft"><u>Disclaimer</u> · © 2026 ReadTomato™</div>`});
  S.noteTo = PEOPLE[0];
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.noteTo = b.dataset.w;
  });
  const a = document.querySelector('[data-add]'); if (a) a.onclick = seats;
  $('#ad').onclick = ()=>{
    const t = $('#tx').value.trim(); if (!t) return toast('Type your note first.');
    S.notes.push({id, page:pgOf(id), lbl:c.lbl, text:t, to:S.noteTo, when:'just now', sent:false, done:false, reply:null});
    shut(); draw(); bdg();
    toast('Note saved', ()=>{ S.notes.pop(); draw(); bdg(); });
  };
}
function seats(){

    <div class="itm" style="border:0"><span></span><span class="bdy"><span class="new">One more reviewer</span><span class="stamp">Cancel any time</span></span><span class="amt">$9.00/mo</span></div>

/* ═══════════ review ═══════════ */
function review(){
  const chg = S.changes.length ? S.changes.map((c,i)=>`<div class="itm">
      <span class="who">${esc(c.lbl)} <i>on ${SITE[c.page].name}</i></span>
      <span class="bdy">${c.kind==='copy'?`<span class="old">${esc(c.old.slice(0,64))}${c.old.length>64?'…':''}</span>`:''}
        <span class="new">${esc(c.now.slice(0,72))}${c.now.length>72?'…':''}</span>
        <span class="stamp">Marshall · ${esc(c.when)}</span></span>
      <span class="acts"><button class="pill" data-show="${c.id}">Show me</button><button class="pill" data-undo="${i}">Undo</button></span>
    </div>`).join('') : '<div class="empty">Nothing changed yet.</div>';

  const openN = S.notes.filter(n=>!n.done).length;
  const nts = S.notes.length ? S.notes.map((n,i)=>`<div class="itm ${n.done?'gone':''}">
      <input type="checkbox" data-n="${i}" ${S.picked.has(i)?'checked':''} ${n.done?'disabled':''}>
      <span class="bdy"><span class="who">${esc(n.lbl)} ${n.to?`<i>for ${esc(n.to)}</i>`:'<em>nobody chosen yet</em>'}</span>
        <span class="new">${esc(n.text)}</span>
        <span class="stamp">Marshall · ${esc(n.when)}${n.sent?' · sent':''}</span>
        ${n.reply?`<span class="msg them" style="margin-top:.2rem"><b>${esc(n.to)}</b>${esc(n.reply)}</span>`:''}</span>
      <span class="acts"><button class="pill" data-show="${n.id}">Show me</button>
        <button class="pill" data-sort="${i}">${n.done?'Reopen':'Sorted'}</button></span>
    </div>`).join('') : '<div class="empty">No notes yet. Use Comment, then click part of your page.</div>';

  const bst = S.boosts.length ? S.boosts.map(b=>`<div class="itm">
      <span class="who">${esc(b.lbl)}</span>
      <span class="bdy"><span class="new">On ${SITE[b.page].name}</span>
        <span class="stamp">AI +${b.gain[0]} · AEO +${b.gain[1]} · SEO +${b.gain[2]}</span></span>
      <span class="acts"><span class="amt">${M(b.price)}</span><button class="pill" data-show="${b.id}">Show me</button></span>
    </div>`).join('') : '<div class="empty">No boosts yet.</div>';

  open({ ttl:'<b>Review the whole site</b>', body:`
    <div class="sec"><button class="sec-hd" data-t="r1" aria-expanded="true">What changed (${S.changes.length})<span class="tw">✕</span></button>
      <div class="sec-bd" id="r1">${chg}</div></div>
    <div class="sec"><button class="sec-hd" data-t="r2" aria-expanded="${openN?'true':'false'}">Notes (${openN} open of ${S.notes.length})<span class="tw">${openN?'✕':'+'}</span></button>
      <div class="sec-bd" id="r2" ${openN?'':'hidden'}>${nts}
        ${S.notes.length?`<div class="help" style="padding-top:.5rem">Tick the notes you want to send</div>
        <button class="g wide" id="send" ${S.picked.size?'':'disabled'}>Send the ticked notes</button>
        <div class="mini" style="padding-top:.3rem">Each note goes to the person it was already meant for — one message each, holding only their notes.</div>`:''}</div></div>
    <div class="sec"><button class="sec-hd" data-t="r3" aria-expanded="true">Boosts on this page (${S.boosts.filter(b=>b.page===S.page).length})<span class="tw">✕</span></button>
      <div class="sec-bd" id="r3">${bst}
        <div class="spent"><span>Spent on this page</span><span class="amt">${M(pageSpend(S.page))}</span></div>
        <div class="mini">Across the whole site so far: ${M(S.boosts.reduce((t,b)=>t+b.price,0))} · settles when you press Done.</div></div></div>
    <div class="p-ft">Approved by <b>Marshall</b>, just now.</div>`});

  document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>showMe(b.dataset.show));
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{
    const c = S.changes[+b.dataset.undo], k = comp(c.id);
    if (c.kind==='alt') k.alt = c.old==='(nothing)'?'':c.old; else k.text = c.old;
    S.changes.splice(+b.dataset.undo,1); draw(); review(); bdg(); toast('Change undone.');
  });
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
    const n = S.notes[+b.dataset.sort]; n.done = !n.done; S.picked.delete(+b.dataset.sort);
    draw(); review(); bdg();
  });
  document.querySelectorAll('[data-n]').forEach(cb=>cb.onchange=()=>{
    const i = +cb.dataset.n; cb.checked ? S.picked.add(i) : S.picked.delete(i);
    const s = $('#send'); if (s) s.disabled = !S.picked.size;
  });
  const s = $('#send');
  if (s) s.onclick = ()=>{
    if (!S.picked.size) return;
    const by = {};
    [...S.picked].forEach(i=>{ const n = S.notes[i]; (by[n.to] = by[n.to]||[]).push(n);
      n.sent = true; n.reply = 'Looks good — happy for you to publish this.'; });
    const names = Object.keys(by), n = S.picked.size; S.picked.clear();
    review(); bdg();
    toast(`${n} note${n>1?'s':''} sent on — ${names.map(k=>`<b>${k}</b> got ${by[k].length}`).join(', ')}, one message each. Carry on looking around whenever you like.`);
  };
}

        ${PEOPLE.slice(0,S.seats).map(p=>`<div class="itm"><span class="who"><i>Reviewer</i></span><span class="bdy"><span class="new">${esc(p)} — notes only</span></span><span></span></div>`).join('')}
        ${S.seats<2?'<div class="itm"><span></span><span class="bdy"><span class="stamp">One seat is included. A second is $9/mo.</span></span><span class="acts"><button class="pill" id="as">Add</button></span></div>':''}</div></div>

      <div class="sec-bd" id="a4" hidden><div class="itm">
        <span></span><span class="bdy"><span class="new">Confirm before each boost</span><span class="stamp">${S.skipConfirm?'Off — boosts apply in one step':'On — Sitecraft asks first'}</span></span>
        <span class="acts"><button class="pill" id="fc">${S.skipConfirm?'Turn on':'Turn off'}</button></span></div></div></div>
    <div class="note-amber">Your plan is <b>$299/mo</b>. Boosts are agreed as you pick them and settle as one amount each time you press Done.</div>
    <div class="p-ft"><u>All my details</u> · © 2026 ReadTomato™</div>`});
  const a = $('#as'); if (a) a.onclick = seats;
  $('#fc').onclick = ()=>{ S.skipConfirm = !S.skipConfirm; account(); };

/* ═══════════ the ? guide ═══════════ */
function guide(){
  const pg = SITE[S.page], list = pg.comps.filter(c=>c.price);
  const left = list.filter(c=>!isBoosted(c.id));
  const tot = left.reduce((t,c)=>t+c.price,0);
  open({ ttl:`<b>What is on ${pg.name}</b>`, flag: pg.critical?'SEO/AEO Critical Page':'', body:`
    <div class="help">Everything Sitecraft can see on this page, and what each part scores right now. Outlined on the page behind this.</div>
    <div class="sec-bd">${pg.comps.map(c=>{
      const b = isBoosted(c.id);
      return `<div class="itm"><span class="who">${esc(c.lbl)}</span>
        <span class="bdy"><span class="new">${esc(c.text.slice(0,40))}${c.text.length>40?'…':''}</span>
          <span class="stamp">now ${avg(c.s).toFixed(1)}/10${c.u?` → could be ${avg(c.u).toFixed(1)}/10`:''}</span></span>
        <span class="acts"><span class="amt" style="color:${b?'var(--green-d)':c.price?'var(--navy)':'var(--amber-ink)'}">${b?'✓ done':c.price?M(c.price):'needs you'}</span>
        <button class="pill" data-show="${c.id}">Show me</button></span></div>`;
    }).join('')}</div>
    ${tot?`<div class="spent"><span>Boost all ${left.length} left on this page</span><span class="amt">${M(tot)}</span></div>
      <button class="g wide" id="all">Boost the whole page · ${M(tot)}</button>
      <div class="mini">Adds to this session. Nothing charged until you press Done.</div>`:'<div class="help">Everything boostable on this page is done.</div>'}
    <div class="p-ft"><u>Disclaimer</u> · © 2026 ReadTomato™</div>`});
  document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>showMe(b.dataset.show));
  const a = $('#all');
  if (a) a.onclick = ()=>{
    const snap = left.map(c=>({c, was: c.t==='img'?c.alt:c.text}));
    left.forEach(c=>{ if(c.t==='img') c.alt=c.up; else c.text=c.up;
      S.boosts.push({id:c.id,page:pgOf(c.id),lbl:c.lbl,price:c.price,gain:c.u.map((v,i)=>+(v-c.s[i]).toFixed(1))}); });
    S.session += tot; S.boostCount += left.length;
    shut(); draw(); bdg();
    toast(`Boosted ${left.length} parts of ${pg.name}. <b>${M(tot)}</b> on this session.`, ()=>{
      snap.forEach(({c,was})=>{ if(c.t==='img') c.alt=was; else c.text=was; });
      S.boosts.splice(S.boosts.length-left.length, left.length);
      S.session -= tot; S.boostCount -= left.length; draw(); bdg();
    });
  };
}
