<title>Sitecraft Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════ V1 design system ═══════ */
:root{
  --navy:#16243C; --navy-2:#2C3E5C; --bar:#131A28; --bar-2:#26314A;
  --red:#C41E3A; --red-2:#E8455E;
  --green:#7EB93F; --green-d:#6BA032; --green-x:#5A8829; --green-pale:#EAF4DC; --green-ink:#4C7A1F;
  --amber:#E2932B; --amber-bg:#FDF4E3; --amber-ink:#8A6416;
  --blue:#2563EB;
  --page:#F4F5F7; --card:#FFFFFF; --sunk:#EFF1F4; --rule:#E4E7EC; --rule-2:#EEF0F3;
  --ink:#16243C; --ink-2:#495A72; --mut:#77869B; --faint:#9AA7B8;
  --sh:0 14px 44px rgba(16,24,40,.18);
  --f:"Inter",ui-sans-serif,system-ui,sans-serif;
  --m:"Inter",ui-sans-serif,system-ui,sans-serif;  /* numbers: Inter with tabular figures */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#E7ECF3; --navy-2:#B7C3D4; --bar:#0A0E16; --bar-2:#1E2739;
  --red:#F2647C; --red-2:#F2647C;
  --green:#8CC64C; --green-d:#7EB93F; --green-x:#6FA636; --green-pale:#1E2A16; --green-ink:#A8D472;
  --amber:#E2932B; --amber-bg:#2A2113; --amber-ink:#E0B476;
  --page:#0E1319; --card:#161C25; --sunk:#1E252F; --rule:#2A3240; --rule-2:#222932;
  --ink:#E7ECF3; --ink-2:#B2BECD; --mut:#8494A6; --faint:#66748A;
  --sh:0 14px 44px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --navy:#E7ECF3; --navy-2:#B7C3D4; --bar:#0A0E16; --bar-2:#1E2739;
  --red:#F2647C; --red-2:#F2647C;
  --green:#8CC64C; --green-d:#7EB93F; --green-x:#6FA636; --green-pale:#1E2A16; --green-ink:#A8D472;
  --amber:#E2932B; --amber-bg:#2A2113; --amber-ink:#E0B476;
  --page:#0E1319; --card:#161C25; --sunk:#1E252F; --rule:#2A3240; --rule-2:#222932;
  --ink:#E7ECF3; --ink-2:#B2BECD; --mut:#8494A6; --faint:#66748A;
  --sh:0 14px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--card);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:7rem}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════ the client's site ═══════ */
nav.site{display:flex;align-items:center;gap:1.5rem;padding:.9rem 2.2rem;border-bottom:1px solid var(--rule);position:relative;flex-wrap:wrap;background:var(--card)}
nav.site .lg{font-weight:800;letter-spacing:-.02em;font-size:1rem;margin-right:auto;color:var(--navy)}
nav.site a{font-size:.85rem;font-weight:500;color:var(--ink-2);text-decoration:none}
nav.site a.on{color:var(--blue);font-weight:600}
nav.site .navlock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);font-size:.78rem;font-weight:600;color:var(--amber-ink);gap:.4rem}
body.editing nav.site .navlock{display:flex}

.hero{background:var(--bar);padding:3.2rem 2.2rem;color:#fff}
.hero .in{max-width:52rem;margin:0 auto}
main{max-width:52rem;margin:0 auto;padding:2.2rem 2.2rem 3rem}
.kick{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 .6rem}
.hero .kick{color:#7FA6F5}
h1.c{font-size:2.3rem;line-height:1.1;letter-spacing:-.028em;font-weight:800;margin:0 0 .8rem;text-wrap:balance}
.hero h1.c{color:#fff}
h2.c{font-size:1.4rem;line-height:1.24;font-weight:700;letter-spacing:-.018em;margin:2rem 0 .6rem;color:var(--navy);text-wrap:balance}
p.c{margin:0 0 1rem;color:var(--ink-2);font-size:.98rem;line-height:1.7}
.hero p.c{color:#C3CEE2;max-width:44rem}
.img.c{background:var(--sunk);border-radius:4px;display:grid;place-items:center;font-family:var(--m);font-size:.7rem;color:var(--faint);aspect-ratio:1200/630;margin:0 0 1.2rem;padding:1rem;text-align:center}
.band.c{background:var(--sunk);padding:.8rem 1rem;border-radius:4px;font-size:.88rem;color:var(--mut);margin:1rem 0}

.c{position:relative;border-radius:3px;transition:box-shadow .15s;scroll-margin:7rem}
body.pick .c{cursor:pointer}
body.pick .c:hover{box-shadow:0 0 0 2px var(--blue)}
.c.sel{box-shadow:0 0 0 2px var(--blue)}
body.ident .c[data-boost]{box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 45%,transparent)}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:0 0 0 3px transparent}}
.c.fl{animation:fl 1.6s ease-out}

.etag{position:absolute;top:-.72rem;right:.2rem;display:none;gap:.25rem;z-index:6;align-items:center}
body.pick .c:hover .etag,.c.sel .etag,body.ident .c .etag{display:flex}
.etag span{font-size:.62rem;font-weight:700;padding:.14rem .4rem;border-radius:3px;background:var(--bar);color:#fff;white-space:nowrap;letter-spacing:.02em}
.etag .pr{background:var(--red)}
.etag .dn{background:var(--green-d)}
.npin{position:absolute;top:-.5rem;left:-.55rem;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--amber);color:#fff;font-size:.64rem;font-weight:800;display:grid;place-items:center;z-index:7}

/* ═══════ floating bar ═══════ */
.bar{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%);background:var(--bar);border:1px solid rgba(255,255,255,.09);border-radius:999px;display:flex;gap:.2rem;padding:.4rem;box-shadow:var(--sh);z-index:100;max-width:calc(100vw - 1rem);overflow-x:auto}
.bar button{border:0;background:transparent;color:#C7D0DE;border-radius:999px;padding:.5rem .85rem;display:flex;align-items:center;gap:.42rem;font-size:.82rem;font-weight:600;white-space:nowrap;position:relative}
.bar button svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar button:hover{background:var(--bar-2);color:#fff}
.bar button.on{background:#fff;color:var(--bar)}
.bar button.done.armed{background:var(--green);color:#fff}
.bar .bdg{background:var(--amber);color:#fff;font-size:.66rem;font-weight:800;padding:.05rem .32rem;border-radius:999px;min-width:1.1rem;text-align:center}
.bar .ses{font-variant-numeric:tabular-nums;color:var(--green);font-family:var(--m);font-size:.76rem;font-weight:600;padding:.5rem .7rem;border-left:1px solid var(--bar-2);margin-left:.15rem;display:flex;align-items:center}

/* ═══════ panel ═══════ */
.scrim{position:fixed;inset:0;background:rgba(12,18,28,.4);z-index:70;display:none}
.scrim.open{display:block}
.pan{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(27rem,calc(100vw - 1.5rem));max-height:92vh;height:auto;background:var(--card);border-radius:14px;box-shadow:var(--sh);z-index:80;display:grid;grid-template-rows:auto 1fr;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;overflow:hidden}
.pan.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pan.open.moved{transform:none}
.pan.moved{transition:opacity .16s}
.pan.dragging{transition:none}
.p-hd{position:relative;padding:.85rem 1.1rem .3rem;display:flex;align-items:center;gap:.5rem;cursor:grab;user-select:none}
.p-hd:active{cursor:grabbing}
.p-hd .ttl{font-size:.72rem;font-weight:600;color:var(--mut);line-height:1.3;min-width:0;display:flex;align-items:center;gap:.34rem;flex-wrap:wrap;letter-spacing:.005em}
.p-hd .ttl i{font-style:normal;color:var(--faint);font-weight:500}
.p-hd .dot{color:var(--rule);font-weight:400}
.flagchip{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;white-space:nowrap}
.flagchip.v3{color:var(--red)}
.flagchip.v2{color:var(--ink-2)}
.flagchip.v1{color:var(--faint)}
.qmark{border:0;background:var(--green);color:#fff;width:1.05rem;height:1.05rem;border-radius:50%;font-size:.64rem;font-weight:800;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none;transition:background .12s,color .12s}
.qmark::before{content:'?';display:block;line-height:1;text-align:center}
.qmark:hover,.qmark:focus-visible{background:var(--green-x)}
.flagchip .qmark{margin-left:.28rem}
.tile.up .tl .qmark{background:var(--green-d)}
/* the header tooltip, capped at two lines so it can never wreck the panel */
.headtip{position:absolute;top:2.3rem;left:1.1rem;right:1.1rem;z-index:9;background:var(--bar);color:#fff;font-size:.75rem;line-height:1.4;border-radius:8px;padding:.42rem .6rem;opacity:0;pointer-events:none;transition:opacity .12s;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.headtip.on{opacity:1}
.p-back{margin-left:auto;border:0;background:transparent;color:var(--green);font-size:1.05rem;line-height:1;font-weight:800;padding:0 .1rem;flex:none}
.p-back[hidden]+.p-x{margin-left:auto}
.p-back:hover,.p-x:hover{color:var(--green-d)}
.p-x{border:0;background:transparent;color:var(--green);font-size:1.05rem;line-height:1;font-weight:800;padding:0 .1rem 0 .55rem;flex:none}
.p-bd{overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:.9rem 1.05rem 1.05rem;display:flex;flex-direction:column;gap:.7rem}
.p-bd::-webkit-scrollbar{display:none}
.p-ft{font-size:.68rem;color:var(--faint);text-align:center;padding-top:.35rem}
.p-ft u{cursor:pointer}

/* buttons */
.g{border:0;background:var(--green);color:#fff;padding:.8rem 1.3rem;border-radius:999px;font-size:.94rem;font-weight:700;letter-spacing:-.008em;text-align:center;width:100%;
  transition:background .14s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.g:hover{background:var(--green-d)}
.g:active{background:var(--green-x)}
.g[disabled]{background:var(--sunk);color:var(--faint);cursor:not-allowed}
.g .amt2{font-variant-numeric:tabular-nums;margin-left:auto;font-family:var(--m);font-weight:700;opacity:.95}
.g .arw{font-weight:800;opacity:.8}
.ghost{border:0;background:transparent;color:var(--mut);font-size:.83rem;font-weight:600;padding:.5rem;width:100%;text-align:center;border-radius:999px}
.ghost:hover{background:var(--sunk);color:var(--ink-2)}
.pill{border:0;background:var(--sunk);color:var(--ink-2);padding:.34rem .8rem;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;transition:border-color .14s,background .14s}
.pill:hover{background:var(--rule)}
.pair{display:grid;grid-template-columns:auto 1fr;gap:.55rem;align-items:center}

/* ── staged flow ── */
.stage{display:grid;gap:.5rem}
.sdone{display:flex;align-items:center;gap:.55rem;padding:.55rem .7rem;background:var(--green-pale);border-radius:9px;font-size:.84rem;font-weight:600;color:var(--green-ink)}
.sdone .tick{width:1.15rem;height:1.15rem;border-radius:50%;background:var(--green-d);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:800;flex:none}
.sdone .lbl2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdone button{margin-left:auto;border:0;background:transparent;color:var(--green-ink);font-size:.78rem;font-weight:700;text-decoration:underline;padding:0;flex:none}
.ask{font-size:1.02rem;font-weight:700;color:var(--navy);letter-spacing:-.015em;line-height:1.3;display:flex;align-items:center;gap:.4rem}
.sub{font-size:.82rem;color:var(--mut);line-height:1.45;margin-top:-.25rem}

.drop{position:relative;border:0;border-radius:14px;background:var(--sunk);min-height:9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.1rem 1rem;gap:.1rem;cursor:pointer;transition:border-color .14s,background .14s}
.drop:hover{background:var(--green-pale)}
.drop.over{background:var(--green-pale)}
.drop b{font-size:.88rem;color:var(--navy);font-weight:600;line-height:1.3}
.drop span{font-size:.76rem;color:var(--mut);line-height:1.35}
.drop em{position:absolute;left:0;right:0;bottom:.7rem;font-style:normal;font-size:.71rem;color:var(--faint);text-align:center}
.drop.has{padding:0;overflow:hidden;min-height:0;background:var(--card)}
.drop.has img{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover}
.crop{width:100%;aspect-ratio:1200/630;border-radius:12px;background-repeat:no-repeat;background-color:var(--sunk);cursor:grab;position:relative;overflow:hidden}
.crop:active{cursor:grabbing}
.crop .hint{position:absolute;left:50%;bottom:.5rem;transform:translateX(-50%);background:rgba(10,14,20,.62);color:#fff;font-size:.68rem;font-weight:600;padding:.16rem .55rem;border-radius:999px;pointer-events:none;transition:opacity .2s}
.crop.moved .hint{opacity:0}
.zoomrow{display:flex;align-items:center;gap:.6rem;font-size:.72rem;color:var(--mut);font-weight:600}
.zoomrow input[type=range]{flex:1;min-width:0;accent-color:var(--green);height:1.1rem}
.reset{border:0;background:var(--green);color:#fff;font-size:.72rem;font-weight:700;padding:.26rem .7rem;border-radius:999px;flex:none}
.reset:hover{background:var(--green-d)}
.fld{width:100%;font-family:var(--f);font-size:.9rem;line-height:1.45;padding:.7rem .8rem;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);outline:none}
.fld.grow{resize:none;overflow:hidden;display:block}
.fld:focus{outline:2px solid var(--green);outline-offset:-2px}

/* copy boxes */
.box{background:var(--sunk);border:0;border-radius:7px;padding:.65rem .75rem;font-size:.9rem;line-height:1.6;color:var(--ink-2)}
.box.ed{background:var(--card);color:var(--ink);outline:2px solid var(--blue);outline-offset:-2px}
.box ins{background:var(--green-pale);color:var(--green-ink);text-decoration:none;border-radius:2px;padding:0 .08rem}
.box del{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);border-radius:2px;padding:0 .08rem}
.lab{font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);font-weight:700;display:flex;align-items:center;gap:.4rem}
.lab .n{margin-left:auto;font-family:var(--m);letter-spacing:0;text-transform:none;font-weight:500}
.wc{font-variant-numeric:tabular-nums;font-family:var(--m);font-size:.72rem;font-weight:500;color:var(--mut)}
.wc.bad{color:var(--red)}.wc.ok{color:var(--green-ink)}
.help{font-size:.76rem;color:var(--mut);text-align:center;line-height:1.45}
.note-amber{background:var(--amber-bg);color:var(--amber-ink);border-radius:6px;padding:.55rem .7rem;font-size:.78rem;line-height:1.45}
.note-amber b{font-weight:700}

/* content analysis */
.ca{border-radius:10px;background:transparent}
.ca-hd{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:.62rem;padding:.62rem .7rem .5rem;text-align:left}
.ca-sc{font-variant-numeric:tabular-nums;width:2.05rem;height:2.05rem;border-radius:50%;background:var(--red);color:#fff;font-size:.78rem;font-weight:800;display:grid;place-items:center;flex:none;font-family:var(--m)}
.ca-hd.up .ca-sc{background:var(--green-d)}
.ca-nm{display:grid;gap:.05rem;min-width:0}
.ca-nm b{font-size:.86rem;font-weight:700;color:var(--navy)}
.ca-nm span{font-size:.73rem;color:var(--ink-2);line-height:1.35}
.ca-hd .tw{margin-left:auto;color:var(--green);font-weight:800;font-size:1rem;flex:none}
.ca-bd{padding:0 .7rem .2rem;display:grid;gap:.6rem;background:transparent}
.ca-bd[hidden]{display:none}
.ca-t{text-align:center;font-size:.84rem;font-weight:700;color:var(--navy)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.tile{background:var(--sunk);border-radius:10px;padding:.55rem .35rem .5rem;text-align:center;cursor:help;transition:background .14s}
.tile:hover,.tile:focus-visible{background:var(--green-pale)}
.tile.up{background:var(--green-pale)}
.tile .tl{display:flex;align-items:center;justify-content:center;gap:.1rem;font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--ink-2);display:block;margin-bottom:.1rem;line-height:1.25}
.tile.up .tl{color:var(--green-ink)}
.tile .tv{font-variant-numeric:tabular-nums;font-family:var(--m);font-size:1.2rem;font-weight:700;color:var(--red);letter-spacing:-.02em}
.tile.up .tv{color:var(--green-x)}
.tile .tu{font-size:.7rem;font-weight:600;color:var(--mut)}
.tile.up .tu{color:var(--green-ink)}
.tile .tw{display:block;font-size:.62rem;letter-spacing:.02em;font-weight:700;color:var(--green-x);margin-top:.18rem}
.tile .tp{font-variant-numeric:tabular-nums;display:block;font-family:var(--m);font-size:.7rem;font-weight:500;color:var(--ink-2);margin-top:.1rem}
.tile.up .tp{color:var(--green-ink)}
/* the tooltip: an overlay, so showing it can never move the tile you are pointing at */
.tilewrap{position:relative}
.tipline{position:absolute;top:calc(100% + .3rem);left:0;right:0;z-index:6;font-size:.78rem;line-height:1.4;color:#fff;background:var(--bar);border-radius:9px;padding:.5rem .65rem;opacity:0;pointer-events:none;transition:opacity .12s;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tipline.on{opacity:1}
.tipline b{color:#9BD35F;font-weight:700}
.ca-hd .ca-q{flex:none}
.ca-hd .ca-nm{flex:none}
.tile .tl .qmark{width:.88rem;height:.88rem;font-size:.56rem;margin-left:.22rem}
.tagrow2{display:flex;gap:.3rem;flex-wrap:nowrap;overflow:hidden;align-items:center;min-height:1.35rem}
.tag0,.tag1,.tagadd{font-size:.7rem;font-weight:600;padding:.14rem .5rem;border-radius:999px;white-space:nowrap;flex:none}
.tagadd{border:1.5px solid var(--green);background:var(--card);color:var(--green-d)}
.tagadd:hover{background:var(--green);color:#fff}
.tagmine{background:var(--sunk);color:var(--ink-2);display:inline-flex;align-items:center;gap:.24rem}
.tagkept{background:var(--sunk);color:var(--green-ink)}
.tagx{border:0;background:transparent;color:var(--faint);font-size:.82rem;line-height:1;padding:0;font-weight:700}
.tagx:hover{color:var(--red)}
.taginput{border:0;outline:2px solid var(--green);outline-offset:-2px;background:var(--card);color:var(--ink);
  font-family:var(--f);font-size:.7rem;font-weight:600;padding:.14rem .5rem;border-radius:999px;width:7rem;flex:none}
.tagmore{border:0;background:var(--sunk);color:var(--green-d);font-size:.7rem;font-weight:700;padding:.14rem .5rem;border-radius:999px;white-space:nowrap;flex:none}
.tagmore:hover{background:var(--green);color:#fff}
.tagctl{display:flex;align-items:center;gap:.45rem;margin-top:.1rem}
.taghelp{margin-left:auto;border:0;background:transparent;color:var(--green-d);font-size:.7rem;font-weight:700;padding:.14rem 0;text-decoration:underline;white-space:nowrap}
.taghelp:hover{color:var(--green-x)}
.tagrow2.open{flex-wrap:wrap;overflow:visible}
.labnote{font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut);font-size:.6rem}
.tag0{background:var(--sunk);color:var(--faint)}
.tag1{background:var(--green-pale);color:var(--green-ink)}
.ba{display:grid;gap:.3rem}
.ba+.ba{margin-top:.15rem}
.ba.up{padding-top:.55rem;border-top:1px solid var(--rule-2)}
.lab.up{color:var(--green-ink)}
.box.upbox{background:var(--green-pale);color:var(--green-x);font-weight:500}
.rec.done span{color:var(--green-x)}
.rec.quiet{font-size:.74rem;font-weight:500;color:var(--mut)}
.rec.quiet span{color:var(--mut)}
/* the previous stage stays on screen, compressed, so the new one reads as growth */
.ba.squash{display:grid;gap:.25rem;padding:.45rem .55rem;background:var(--sunk);border-radius:9px}
.ba.squash .cline{display:flex;align-items:center;gap:.5rem;min-width:0}
.ba.squash .lab{flex:none;font-size:.55rem;color:var(--mut)}
.ba.squash .ctext{font-size:.76rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tagrow2.mini{min-height:0}
.tagrow2.mini .tag0,.tagrow2.mini .tag1{font-size:.62rem;padding:.06rem .38rem}
.tagrow2.mini .tagadd{display:none}
.tile,.tile .tv,.tile .tl,.tile .tu{transition:background .55s,color .55s}
.rec{font-size:.83rem;font-weight:700;color:var(--navy);text-align:center;line-height:1.45}
.rec span{color:var(--red)}

/* collapsibles */
.coll{border-top:1px solid var(--rule-2)}
.coll-hd{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:.5rem;padding:.5rem 0;text-align:left;font-size:.82rem;font-weight:700;color:var(--navy)}
.coll-hd .tw{margin-left:auto;color:var(--green);font-weight:800;font-size:.95rem}
.coll-bd{padding:0 0 .6rem;font-size:.81rem;color:var(--ink-2);line-height:1.55;display:grid;gap:.45rem}
.coll-bd[hidden]{display:none}
.coll-bd b{color:var(--navy);font-weight:700}

/* rows / lists */
.sec{display:grid;gap:.3rem}
.sec-hd{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:.5rem;padding:.45rem 0;font-size:.86rem;font-weight:700;color:var(--navy);text-align:left;border-bottom:1px solid var(--rule-2)}
.sec-hd .tw{margin-left:auto;color:var(--green);font-weight:800;font-size:.95rem}
.sec-bd{display:grid}
.sec-bd[hidden]{display:none}
.itm{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem .55rem;padding:.6rem 0;border-bottom:1px solid var(--rule-2);align-items:start}
.itm:last-child{border-bottom:0}
.itm.stack{grid-template-columns:1fr auto}
.itm.stack .who{display:block;margin-bottom:.1rem}
.itm .who{font-size:.75rem;font-weight:700;color:var(--red)}
.itm .who i{font-style:normal;color:var(--green-ink);font-weight:600}
.itm .who em{font-style:normal;color:var(--amber-ink);font-weight:600}
.itm .bdy{min-width:0;display:grid;gap:.12rem}
.itm .old{font-size:.82rem;color:var(--faint);text-decoration:line-through}
.itm .new{font-size:.85rem;color:var(--ink)}
.itm .stamp{font-size:.7rem;color:var(--faint)}
.itm .acts{display:grid;gap:.28rem;justify-items:stretch}
.itm .amt{font-variant-numeric:tabular-nums;font-family:var(--m);font-size:.86rem;font-weight:700;color:var(--navy);text-align:right;white-space:nowrap}
.itm.gone .new,.itm.gone .who{color:var(--faint);text-decoration:line-through}
.itm input[type=checkbox]{margin:.25rem 0 0;accent-color:var(--green)}
.upsell{font-size:.74rem;color:var(--green-ink);line-height:1.35;margin-top:.15rem}
.mini-g{border:0;background:var(--green);color:#fff;padding:.28rem .7rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.mini-g:hover{background:var(--green-d)}
.lastcall{display:grid;gap:.5rem;padding:.7rem;margin-top:.5rem;background:var(--green-pale);border-radius:12px;font-size:.79rem;color:var(--green-ink);line-height:1.4}
.lastcall b{color:var(--green-x);font-weight:700}
.spent{display:flex;align-items:baseline;gap:.6rem;padding-top:.6rem;font-size:.88rem;font-weight:700;color:var(--navy)}
.spent .amt{font-variant-numeric:tabular-nums;margin-left:auto;font-family:var(--m);font-size:1.35rem;font-weight:800}
.mini{font-size:.73rem;color:var(--faint);text-align:center}
.empty{padding:1.1rem .5rem;text-align:center;color:var(--faint);font-size:.8rem}

.chips{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:600;padding:.14rem .45rem;border-radius:4px;background:var(--sunk);color:var(--ink-2)}
.chip.gr{background:var(--green-pale);color:var(--green-ink)}
.chip.am{background:var(--amber-bg);color:var(--amber-ink)}
.who-pick{display:flex;gap:.35rem;flex-wrap:wrap}
.who-pick button{border:0;background:var(--sunk);padding:.3rem .7rem;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--mut)}
.who-pick button.on{background:var(--green-pale);color:var(--green-ink)}
textarea.ta{width:100%;font-family:var(--f);font-size:.87rem;padding:.6rem .7rem;border:0;outline:2px solid var(--blue);outline-offset:-2px;border-radius:7px;background:var(--sunk);color:var(--ink);resize:vertical;min-height:4.4rem}
.msg{font-size:.81rem;line-height:1.45;padding:.45rem .6rem;border-radius:6px;background:var(--sunk)}
.msg b{display:block;font-size:.68rem;color:var(--faint);font-weight:600;margin-bottom:.1rem}
.msg.them{background:var(--green-pale);color:var(--green-ink)}

.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--bar);color:#fff;padding:.6rem 1rem;border-radius:9px;font-size:.83rem;box-shadow:var(--sh);z-index:110;text-align:center;max-width:calc(100vw - 2rem);line-height:1.4}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:#9BD35F;text-decoration:underline;font-size:.8rem;font-weight:700;margin-left:.6rem}
.banner{position:fixed;top:0;left:0;right:0;background:var(--amber);color:#2A1F06;font-size:.76rem;font-weight:700;padding:.35rem 1rem;text-align:center;z-index:65;display:none}
body.editing .banner{display:block}
body.editing nav.site{margin-top:1.6rem}
</style>

function dif(a,b){
  const A=a.split(/(\s+)/),B=b.split(/(\s+)/),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const o=[];const p=(t,x)=>{const l=o[o.length-1];if(l&&l.t===t)l.x+=x;else o.push({t,x});};
  let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){p('=',A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){p('-',A[i]);i++;}else{p('+',B[j]);j++;}}
  while(i<n)p('-',A[i++]);while(j<m)p('+',B[j++]);return o;
}

    if (c.t==='kick') return `<p class="kick c" data-id="${c.id}"${at}>${pin}${tag}${esc(c.text)}</p>`;
    if (c.t==='band') return `<div class="band c" data-id="${c.id}"${at}>${pin}${tag}${esc(c.text)}</div>`;
    return `<${c.t} class="c" data-id="${c.id}"${at}>${pin}${tag}${esc(c.text)}</${c.t}>`;
  };
  $('#hero').innerHTML = `<div class="in">${pg.comps.filter(c=>c.hero).map(one).join('')}</div>`;
  $('#page').innerHTML = pg.comps.filter(c=>!c.hero).map(one).join('');

    if (!document.body.classList.contains('pick')) return;
    e.preventDefault(); e.stopPropagation(); pick(el.dataset.id);
  });
  bdg();
}
function bdg(){
  const n = S.notes.filter(x=>!x.done).length, r = S.changes.length + S.boosts.length;

/* ═══════════ panel ═══════════ */
function open({ttl, flag, body, back}){
  $('#p-ttl').innerHTML = (ttl||'') + (flag?` <span class="dot">·</span> <span class="flagchip ${flag.cls}">${flag.label}<button class="qmark" data-help="${esc(flag.help)}" aria-label="What is a ${flag.label}?"></button></span>`:'');
  const bk = $('#p-back');
  bk.hidden = !back;
  bk.onclick = () => stepBack();
  $('#p-bd').innerHTML = body || '';
  $('#toast').hidden = true; clearTimeout(toast._t);
  const pan = $('#pan');
  if (!pan.classList.contains('moved')) pan.style.transform = '';
  pan.classList.add('open'); $('#scrim').classList.add('open');
  wireTips();
  const flowComp = () => comp(S.flow && S.flow.id);
  const nb = document.querySelector('[data-newtag]');
  if (nb) nb.onclick = () => { S.flow.addingTag = true; flow(); };
  document.querySelectorAll('[data-deltag]').forEach(b=>b.onclick=()=>{
    const c = flowComp(); if (!c) return;
    c.userTags = (c.userTags||[]).filter(t => t !== b.dataset.deltag);
    flow();
  });
  const th = document.querySelector('[data-taghelp]');
  if (th) th.onclick = () => { S.flow.previewed = true; S.flow.rolled = false; flow(); };
  const ti = $('#taginput');
  if (ti){
    ti.focus();
    const commit = () => {
      const c = flowComp(); if (!c) return;
      const v = ti.value.trim().slice(0, 18);
      if (v && !(c.userTags||[]).includes(v) && (c.userTags||[]).length < MAX_OWN_TAGS)
        c.userTags = [...(c.userTags||[]), v];
      S.flow.addingTag = false; flow();
    };
    ti.onkeydown = e => {
      if (e.key === 'Enter'){ e.preventDefault(); commit(); }
      if (e.key === 'Escape'){ e.preventDefault(); S.flow.addingTag = false; flow(); }
    };
    ti.onblur = commit;
  }
  document.querySelectorAll('.tagrow2').forEach(fitTags);
  const ht = $('#headtip');
  if (ht) document.querySelectorAll('[data-help]').forEach(q=>{
    const on = () => { ht.textContent = q.dataset.help; ht.classList.add('on'); };
    const off = () => ht.classList.remove('on');
    q.addEventListener('mouseenter', on); q.addEventListener('focus', on);
    q.addEventListener('mouseleave', off); q.addEventListener('blur', off);
    q.addEventListener('click', e => { e.stopPropagation(); ht.textContent = q.dataset.help; ht.classList.toggle('on'); });
  });
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const t = document.getElementById(b.dataset.t), o = b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded', String(!o)); t.hidden = o;
    const w = b.querySelector('.tw'); if (w) w.textContent = o?'+':'✕';
  });
}
/* a dismissal must never lose what was typed but not yet committed */
function stash(){
  const F = S.flow; if (!F) return;
  const d = $('#dsc'); if (d) F.draftDesc = d.value;
  const e = $('#ed');  if (e) F.draftWords = e.innerText;
}
function shut(){

}
function toast(m, undo){

  $('#toast').hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>$('#toast').hidden=true, 5000);
}

const pageValue = pg => ({ label: VALUE[pg.value], cls: 'v' + pg.value, help: VALUE_HELP[pg.value] });

/* ═══════════ scores block ═══════════ */
function scores(c, proj){
  const cur = c.s, up = c.u;
  const shown = proj && up ? up : cur;
  const badge = (proj ? avg(up) : avg(cur)).toFixed(1);
  const tiles = shown.map((v,i)=>`<div class="tile ${proj?'up':''}">
      <span class="tl">${SCORE_TL[i]}<button class="qmark" data-tip="${i}" aria-label="What is ${SCORE_NM[i]}?"></button></span>
      <span class="tv">${v.toFixed(1)}</span><span class="tu">/10</span>${proj?`<span class="tp">was ${cur[i].toFixed(1)}</span><span class="tw">Projected</span>`:''}
    </div>`).join('');

  /* what it says now, and only after a preview, what it would say */
  const isImg = c.t === 'img';
  const done = isBoosted(c.id) && !!DONE_BY_TYPE[c.t];
  const nowText = isImg ? (c.alt || 'No description yet') : c.text;
  const mine = c.userTags || (c.userTags = []);
  const F = S.flow || {};
  const chips = mine.map(t=>`<span class="tag1 tagmine">${esc(t)}<button class="tagx" data-deltag="${esc(t)}" aria-label="Remove ${esc(t)}">&times;</button></span>`).join('');
  const tagsNow = (mine.length ? '' : '<span class="tag0">None yet</span>') + chips;
  const slot = F.addingTag
    ? `<input class="taginput" id="taginput" maxlength="18" placeholder="Type a tag" autocomplete="off">`
    : (mine.length < MAX_OWN_TAGS ? `<button class="tagadd" data-newtag="1">+ Add tag</button>` : '');
  const helpLink = (canBoost(c) && !isBoosted(c.id))
    ? `<button class="taghelp" data-taghelp="1">Want help adding tags?</button>` : '';
  const tagCtl = (slot || helpLink) ? `<div class="tagctl">${slot}${helpLink}</div>` : '';
  const recs = (TAGS_AFTER[c.t] || []).filter(t => !mine.includes(t));
  const tagsUp = recs.map(t=>`<span class="tag1">${esc(t)}</span>`).join('')
               + mine.map(t=>`<span class="tag1 tagkept">${esc(t)}</span>`).join('');

  return `<div class="ca">
    <div class="ca-hd ${proj?'up':''}">
      <span class="ca-sc">${badge}</span>
      <span class="ca-nm"><b>${esc(tc(c.lbl))} Content Analysis</b></span>
      <button class="qmark ca-q" data-tip="head" aria-label="What is this?"></button>
    </div>
    <div class="ca-bd">
      <div class="tilewrap"><div class="tiles">${tiles}</div>
        <div class="tipline" id="tip"></div></div>
      ${done ? `<div class="rec done"><span>Now in place:</span> ${esc(DONE_BY_TYPE[c.t] || '')}</div>`
             : (c.rec ? `<div class="rec ${proj?'quiet':''}"><span>Right now:</span> ${esc(c.rec)}</div>` : '')}

      ${proj ? `<div class="ba squash">
        <div class="cline"><span class="lab">Current ${isImg?'Description':'Words'}</span><span class="ctext">${esc(nowText)}</span></div>
        <div class="cline"><span class="lab">Current Tags</span><span class="tagrow2 mini">${tagsNow}</span></div>
      </div>` : `<div class="ba">
        <div class="lab">Current ${isImg?'Description':'Words'}</div>
        <div class="box">${esc(nowText)}</div>
        <div class="lab">Current Tags</div>
        <div class="tagrow2">${tagsNow}</div>
        ${tagCtl}
      </div>`}

      ${proj ? `<div class="ba up">
        <div class="lab up">After the Boost</div>
        <div class="box upbox">${esc(c.up)}</div>
        <div class="lab up">Tags It Would Get${mine.length?` <span class="labnote">yours kept</span>`:''}</div>
        <div class="tagrow2">${tagsUp || '<span class="tag1">Structured markup</span>'}</div>
      </div>` : ''}
    </div></div>`;
}

/* one line, always: anything that will not fit is folded into a counter */
function fitTags(row){
  if (!row || !row.clientWidth) return;
  row.querySelectorAll('.tagmore').forEach(m => m.remove());
  if (row.classList.contains('open')) return;
  const chips = [...row.children];
  chips.forEach(c => { c.hidden = false; });
  const gap = parseFloat(getComputedStyle(row).gap) || 5;
  const budget = row.clientWidth - 30;          /* room for the counter */
  let used = 0, over = 0;
  chips.forEach((c, i) => {
    const w = c.getBoundingClientRect().width + (i ? gap : 0);
    if (used + w > budget && i > 0){ c.hidden = true; over++; }
    else used += w;
  });
  if (over){
    const m = document.createElement('button');
    m.className = 'tagmore'; m.textContent = '+' + over;
    m.setAttribute('aria-expanded', 'false');
    m.onclick = () => {
      const open = row.classList.toggle('open');
      m.setAttribute('aria-expanded', String(open));
      if (open){ [...row.children].forEach(c => { c.hidden = false; }); m.textContent = 'Show less'; }
      else fitTags(row);
    };
    row.appendChild(m);
  }
}

/* the numbers roll up in place, the way a slot machine settles */
function rollScores(c){
  const tv = [...document.querySelectorAll('.tile .tv')];
  const badge = document.querySelector('.ca-sc');
  if (!tv.length) return;
  const from = c.s, to = c.u, a = avg(from), b = avg(to);
  const clamp = v => Math.max(0, Math.min(10, v)).toFixed(1);
  const DUR = 780, t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / DUR);
    const e = 1 - Math.pow(1 - p, 3);
    const jitter = (1 - e) * 1.7;
    tv.forEach((el, i) => {
      el.textContent = p > .84 ? clamp(to[i])
        : clamp(from[i] + (to[i] - from[i]) * e + (Math.random() - .5) * jitter);
    });
    if (badge) badge.textContent = p > .84 ? clamp(b)
      : clamp(a + (b - a) * e + (Math.random() - .5) * jitter);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* the tooltip line: one place that speaks only when asked */
function wireTips(){
  const tip = $('#tip'); if (!tip) return;
  document.querySelectorAll('[data-tip]').forEach(t=>{
    const k = t.dataset.tip, i = +k;
    const show = () => {
      tip.innerHTML = k === 'head' ? HEAD_TIP : `<b>${SCORE_NM[i]}.</b> ${TIP[i]}`;
      tip.classList.add('on');
    };
    const hide = () => tip.classList.remove('on');
    t.addEventListener('mouseenter', show); t.addEventListener('focus', show);
    t.addEventListener('mouseleave', hide); t.addEventListener('blur', hide);
    t.addEventListener('click', show);
  });
}

/* ═══════════ edit: one action at a time ═══════════ */
/* No step labels. Each stage completes, collapses to a ticked line, and the
   next action appears as the single primary button naming what it does. */

const setFlow = f => { S.flow = f; S.flows[f.id] = f; return f; };
function editP(id){
  const c = comp(id);
  /* resume where they left off: clicking away is a dismissal, not a discard */
  S.flow = S.flows[id] || setFlow({id, photo:null, desc:null, words:null, analysed:false,
                                   wasSrc:c.src||null, wasFit:c.fit?{...c.fit}:null});
  flow();
}

function flow(){
  const c = comp(S.flow.id), F = S.flow, img = c.t === 'img';
  if (c.blocked) return blockedP(c.id);

  const editDone = img ? (F.photo || F.desc !== null) : (F.words !== null);
  const parts = [];

  /* ── stage 1: the change ── */
  if (editDone){
    parts.push(`<div class="sdone"><span class="tick">✓</span>
      <span class="lbl2">${img ? (F.photo ? 'New photo added' : 'Description updated') : 'Your words saved'}</span>
      <button data-re="1">Change</button></div>`);
    if (img && F.photo && F.desc === null){
      const f = c.fit || (c.fit = {x:50, y:50, z:100});
      parts.push(`<div class="stage">
        <div class="crop" id="crop" style="background-image:url(${c.src});background-size:${f.z}%;background-position:${f.x}% ${f.y}%">
          <span class="hint">Drag to reposition</span></div>
        <div class="zoomrow"><span>Zoom</span><input type="range" id="zoom" min="100" max="260" value="${f.z}"><button class="reset" id="rs">Reset</button></div>
      </div>`);
    }
  } else if (img){
    parts.push(`<div class="stage">
      <div class="drop" id="dz"><b>Drag a New Photo Here</b><span>or Click to Choose One</span><em>Any size, you position it next (now ${c.dim ? c.dim.w + ' × ' + c.dim.h : '1200 × 630'})</em></div>
      <input type="file" id="fi" accept="image/*" hidden>
    </div>`);
  } else {
    parts.push(`<div class="stage">
      <div class="ask">Change the wording</div>
      <div class="box ed" contenteditable="true" id="ed">${esc(F.draftWords ?? c.text)}</div>
      <div class="wc" id="wc"></div>
    </div>`);
  }

  /* ── stage 2 (photos only): what is in it ── */
  if (img && F.photo && F.desc === null){
    parts.push(`<div class="stage">
      <div class="ask">What is in this picture?<button class="qmark" data-help="${esc(PIC_HELP)}" aria-label="Why this matters"></button></div>
      <textarea class="fld grow" id="dsc" rows="1" placeholder="A short, plain description">${esc(F.draftDesc ?? c.alt ?? '')}</textarea>
    </div>`);
  }

  /* ── stage 3: the analysis ── */
  if (F.analysed) parts.push(scores(c, !!F.previewed));

  /* ── the single next action ── */
  let cta = '';
  if (!F.analysed) cta = `<button class="g" id="go">See How AI Reads This <span class="arw">→</span></button>`;
  else if (canBoost(c) && !isBoosted(c.id) && !F.previewed)
    cta = `<button class="g" id="go">Preview Your Boost <span class="arw">→</span></button>`;
  else if (canBoost(c) && !isBoosted(c.id)) cta = `<button class="g" id="go">Boost this ${esc(c.lbl.toLowerCase())}<span class="amt2">${M(c.price)}</span></button>`;
  else if (isBoosted(c.id)) cta = `<div class="sdone"><span class="tick">✓</span><span class="lbl2">Boosted, ${M(S.boosts.find(x=>x.id===c.id).price)} on this session</span></div>`;

  const canBack = img && F.photo && F.desc === null;
  const secondary = canBack
    ? `<button class="ghost" id="bk">← Use my original photo instead</button>`
    : ((img && !F.photo && F.desc === null) || (!img && F.words === null)
        ? '' : `<button class="ghost" id="sv">Boost This ${esc(shortOf(c))} Later</button>`);

  open({ ttl: hdr(c), flag: flagOf(c), back: canStepBack(), body: parts.join('') + cta + secondary });
  if (F.previewed && !F.rolled){ F.rolled = true; rollScores(c); }

  /* ── wiring ── */
  const re = document.querySelector('[data-re]');
  if (re) re.onclick = () => { setFlow({id:c.id, photo:null, desc:null, words:null, analysed:F.analysed, wasSrc:F.wasSrc, wasFit:F.wasFit}); flow(); };

  const dz = $('#dz'), fi = $('#fi');
  if (dz){
    const take = file => {
      if (!file || !file.type.startsWith('image/')) return toast('That needs to be an image file.');
      const r = new FileReader();
      r.onload = e => {
        F.photo = e.target.result; c.src = e.target.result; c.fit = {x:50, y:50, z:100};
        const probe = new Image();
        probe.onload = () => { c.dim = {w:probe.naturalWidth, h:probe.naturalHeight}; };
        probe.src = e.target.result;
        flow(); draw();
      };
      r.readAsDataURL(file);
    };
    dz.onclick = () => fi.click();
    fi.onchange = e => take(e.target.files[0]);
    ['dragenter','dragover'].forEach(k => dz.addEventListener(k, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave','dragend'].forEach(k => dz.addEventListener(k, () => dz.classList.remove('over')));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); take(e.dataTransfer.files[0]); });
  }

  const crop = $('#crop');
  if (crop){
    const f = c.fit;
    const paint = () => {
      crop.style.backgroundSize = f.z + '%';
      crop.style.backgroundPosition = f.x + '% ' + f.y + '%';
      draw();
    };
    let drag = null;
    crop.addEventListener('pointerdown', e => {
      drag = {px:e.clientX, py:e.clientY, x:f.x, y:f.y};
      crop.setPointerCapture(e.pointerId); crop.classList.add('moved');
    });
    crop.addEventListener('pointermove', e => {
      if (!drag) return;
      const r = crop.getBoundingClientRect();
      /* how far the picture can travel depends on how far it is zoomed past the frame */
      const room = Math.max(f.z - 100, 1);
      f.x = Math.min(100, Math.max(0, drag.x - (e.clientX - drag.px) / r.width  * room * 2));
      f.y = Math.min(100, Math.max(0, drag.y - (e.clientY - drag.py) / r.height * room * 2));
      paint();
    });
    ['pointerup','pointercancel'].forEach(k => crop.addEventListener(k, () => { drag = null; }));
    $('#zoom').oninput = e => { f.z = +e.target.value; paint(); };
    $('#rs').onclick = () => { f.x = 50; f.y = 50; f.z = 100; $('#zoom').value = 100; crop.classList.remove('moved'); paint(); };
  }

  const bkBtn = $('#bk');
  if (bkBtn) bkBtn.onclick = () => {
    c.src = F.wasSrc || null; c.fit = F.wasFit || null;
    setFlow({id:c.id, photo:null, desc:null, words:null, analysed:F.analysed, wasSrc:F.wasSrc, wasFit:F.wasFit});
    flow(); draw(); toast('Back to your original photo.');
  };

  const dsc = $('#dsc');
  if (dsc){
    /* grow with the text, so nothing runs off the right edge */
    const grow = () => { dsc.style.height = 'auto'; dsc.style.height = dsc.scrollHeight + 'px'; };
    dsc.addEventListener('input', grow); grow();
    dsc.focus();
    dsc.setSelectionRange(dsc.value.length, dsc.value.length);
    dsc.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); const g=$('#go'); if (g) g.click(); } };
  }

  const ed = $('#ed'), wc = $('#wc');
  if (ed){
    const target = W(c.text);
    const tick = () => {
      const n = W(ed.innerText), ok = n === target;
      wc.className = 'wc ' + (ok ? 'ok' : 'bad');
      wc.textContent = ok ? `${n} of ${target} words` : `${n} of ${target} words, ${n>target?(n-target)+' too many':(target-n)+' to go'}`;
      return ok;
    };
    ed.addEventListener('input', tick); tick();
  }

  const go = $('#go');
  if (go) go.onclick = () => {
    if (dsc) commitDesc();
    if (ed && !commitWords()) return;
    if (!F.analysed){ F.analysed = true; return flow(); }
    if (!F.previewed && canBoost(c)){ F.previewed = true; return flow(); }
    return S.skipConfirm ? apply(c.id) : confirmP(c.id);
  };
  const sv = $('#sv');
  if (sv) sv.onclick = () => { if (ed && !commitWords()) return; if (dsc) commitDesc(); shut(); draw(); flash(c.id); };
}

function commitDesc(){
  const c = comp(S.flow.id), v = $('#dsc') ? $('#dsc').value.trim() : null;
  if (v === null) return;
  const was = c.alt;
  c.alt = v; S.flow.desc = v;
  if (v !== was) S.changes.push({id:c.id, page:pgOf(c.id), lbl:c.lbl, old:was||'(no description)', now:v, when:'just now', kind:'alt'});
  bdg();
}
function commitWords(){
  const c = comp(S.flow.id), ed = $('#ed');
  if (!ed) return true;
  const now = ed.innerText.trim(), target = W(c.text);
  if (W(now) !== target){ toast(`Keep it to ${target} words and this will save.`); return false; }
  if (now !== c.text){
    S.changes.push({id:c.id, page:pgOf(c.id), lbl:c.lbl, old:c.text, now, when:'just now', kind:'copy'});
    c.text = now; draw();
  }
  S.flow.words = now; bdg(); return true;
}

  S.boosts.push({id, page:pgOf(id), lbl:c.lbl, price:c.price, gain:c.u.map((v,i)=>+(v-c.s[i]).toFixed(1))});

/* drag the dashboard anywhere by its header; it recentres when closed */
(function(){
  const pan = $('#pan'), hd = document.querySelector('.p-hd');
  let d = null;
  hd.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = pan.getBoundingClientRect();
    d = {px:e.clientX, py:e.clientY, l:r.left, t:r.top, w:r.width, h:r.height};
    pan.classList.add('moved','dragging');
    pan.style.left = r.left + 'px'; pan.style.top = r.top + 'px';
    pan.style.transform = 'none';
    hd.setPointerCapture(e.pointerId);
  });
  hd.addEventListener('pointermove', e => {
    if (!d) return;
    const nx = Math.min(innerWidth - d.w - 8, Math.max(8, d.l + e.clientX - d.px));
    const ny = Math.min(innerHeight - 56, Math.max(8, d.t + e.clientY - d.py));
    pan.style.left = nx + 'px'; pan.style.top = ny + 'px';
  });
  ['pointerup','pointercancel'].forEach(k => hd.addEventListener(k, () => { d = null; pan.classList.remove('dragging'); }));
})();

/* stage navigation, driven by the back arrow in the header */
function canStepBack(){
  const F = S.flow; if (!F) return false;
  const c = comp(F.id); if (!c) return false;
  if (F.previewed || F.analysed) return true;
  return c.t === 'img' && (F.desc !== null || !!F.photo);
}
function stepBack(){
  const F = S.flow, c = comp(F.id);
  if (F.previewed){ F.previewed = false; F.rolled = false; }
  else if (F.analysed) F.analysed = false;
  else if (c.t === 'img' && F.desc !== null) F.desc = null;
  else if (c.t === 'img' && F.photo) { c.src = F.wasSrc || null; c.fit = F.wasFit || null; F.photo = null; draw(); }
  flow();
}
